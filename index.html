*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:600}.c{text-align:center}
button,.btn{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--chip);color:var(--txt)}button.ghost{background:transparent;color:var(--acc);padding:6px 8px}
button.danger{background:transparent;color:var(--red)}button:disabled{opacity:.5}
button.small{padding:6px 10px;font-size:13px;border-radius:10px}
input,select,textarea{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
input[type=number]{-moz-appearance:textfield}textarea{min-height:80px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs button{background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;font-size:11px;padding:4px 6px;gap:2px;font-weight:500}
nav.tabs button.on{color:var(--acc)}nav.tabs svg{width:24px;height:24px}
.bar{height:8px;border-radius:6px;background:var(--chip);overflow:hidden}.bar>i{display:block;height:100%;border-radius:6px}
.ring{position:relative;width:118px;height:118px}.ring svg{transform:rotate(-90deg)}.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:26px;font-weight:700;line-height:1}
.entry{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.entry:first-of-type{border-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--chip);color:var(--txt);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:500}
.chip.on{background:var(--acc);color:#fff}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:12px;z-index:99;font-size:14px;max-width:90%}
.set{display:grid;grid-template-columns:28px 1fr 1fr 1fr 28px;gap:6px;align-items:center;padding:4px 0;font-size:14px}
.set.wu{opacity:.6}.tag{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--mut)}
.tag.red{background:#fde2e3;color:#b4232a}.tag.grn{background:#dcfce7;color:#166534}.tag.org{background:#fef3c7;color:#92400e}
@media (prefers-color-scheme:dark){.tag.red{background:#3b1517;color:#ff8a8f}.tag.grn{background:#0f2e1b;color:#6ee7a0}.tag.org{background:#3a2a0b;color:#fbbf24}}
.stepper{display:flex;align-items:center;gap:4px}.stepper input{text-align:center;padding:9px 4px}
.stepper button{padding:8px 10px;background:var(--chip);color:var(--txt)}
.musc .m{fill:var(--mut);opacity:.16;transition:opacity .2s}.musc .m.sec{fill:var(--org);opacity:.75}.musc .m.prim{fill:var(--red);opacity:.9}
.musc .m.focus{animation:blink 1s ease-in-out infinite}.musc .sil{fill:none;stroke:var(--mut);opacity:.35;stroke-linecap:round}
@keyframes blink{50%{opacity:.25}}
.reco{border-left:4px solid var(--acc);padding:8px 10px;margin:8px 0;background:var(--bg);border-radius:8px}
.reco.warn{border-color:var(--org)}.reco.bad{border-color:var(--red)}.reco.good{border-color:var(--grn)}
.ai-out{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px;font-size:14px;margin-top:8px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{background:var(--acc2);border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:10px}
table.vol{width:100%;border-collapse:collapse;font-size:13px}table.vol td{padding:4px 2px}
.thumb{max-width:100%;max-height:220px;border-radius:12px;display:block;margin:8px auto}
.exhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.scale{display:flex;gap:4px}.scale button{flex:1;padding:7px 0;background:var(--chip);color:var(--txt);font-weight:500}.scale button.on{background:var(--acc);color:#fff}

function bmr(p, w) { return 10 * w + 6.25 * p.height - 5 * p.age + (p.sex === "f" ? -161 : 5); }

// Série de poids lissée (tendance, moyenne mobile exponentielle)
function weightSeries(days = 120) {
  const out = []; let trend = null; const end = todayKey();
  for (let i = days; i >= 0; i--) {
    const k = addDays(end, -i); const w = Store.get("d-" + k)?.weight;
    if (w) trend = trend == null ? w : trend + 0.1 * (w - trend);
    if (trend != null) out.push({ k, w: w || null, t: trend });
  }
  return out;
}
function dayTotals(k) {
  const d = day(k); const t = {}; NUTR_KEYS.forEach(n => t[n] = 0); t.micro = {};
  (d.entries || []).forEach(e => {
    NUTR_KEYS.forEach(n => t[n] += e.n?.[n] || 0);
    Object.entries(e.micro || {}).forEach(([m, v]) => t.micro[m] = (t.micro[m] || 0) + (+v || 0));
  });
  t.actKcal = (d.acts || []).reduce((s, a) => s + (a.kcal || 0), 0);
  return t;
}
// Estimation adaptative de la dépense (type MacroFactor) : apports réels vs évolution du poids
function adaptiveTDEE() {
  const end = addDays(todayKey(), -1); const N = 28; const intake = []; const pts = [];
  for (let i = N - 1; i >= 0; i--) {
    const k = addDays(end, -i); const t = dayTotals(k); const d = Store.get("d-" + k);
    if (t.kcal >= 1200 && !(d && d.incomplete)) intake.push(t.kcal);
    if (d?.weight) pts.push([N - 1 - i, d.weight]);
  }
  if (intake.length < 10 || pts.length < 4 || pts[pts.length - 1][0] - pts[0][0] < 10) return { ok: false, days: intake.length, weighs: pts.length };
  const n = pts.length, sx = pts.reduce((s, p) => s + p[0], 0), sy = pts.reduce((s, p) => s + p[1], 0);
  const sxx = pts.reduce((s, p) => s + p[0] * p[0], 0), sxy = pts.reduce((s, p) => s + p[0] * p[1], 0);
  const slope = (n * sxy - sx * sy) / (n * sxx - sx * sx); // kg/jour
  const avg = intake.reduce((a, b) => a + b, 0) / intake.length;
  return { ok: true, tdee: avg - slope * 7700, avgIntake: avg, slopeWeek: slope * 7, days: intake.length, weighs: pts.length };
}
function targets() {
  const p = profile(); const w = latestWeight();
  const formula = bmr(p, w) * p.activity;
  const ad = adaptiveTDEE();
  let tdee = formula, source = "formule (Mifflin-St Jeor × activité)";
  if (ad.ok) { tdee = Math.min(formula * 1.25, Math.max(formula * 0.75, ad.tdee)); source = `adaptative : tes apports réels et l'évolution de ton poids sur ${ad.days} j`; }
  let kcal = tdee * (1 + GOALS[p.goal].factor);
  if (p.manualKcal) { kcal = +p.manualKcal; source = "valeur manuelle"; }
  const prot = p.protPerKg * w, fat = Math.max(p.fatPerKg * w, kcal * 0.2 / 9);
  const carb = Math.max(0, (kcal - prot * 4 - fat * 9) / 4);
  return { kcal: r0(kcal), p: r0(prot), f: r0(fat), c: r0(carb), fib: 30, tdee: r0(tdee), formula: r0(formula), adaptive: ad, source, weight: w };
}

function searchFoods(q) {
  const norm = s => s.toLowerCase().replace(/œ/g, "oe").normalize("NFD").replace(/[̀-ͯ]/g, "");
  const words = norm(q).split(/\s+/).filter(Boolean);
  const recents = recentFoods();
  if (!words.length) return recents.slice(0, 15);
  const seen = new Set(); const res = [];
  [...recents, ...allFoods()].forEach(f => {
    const key = f.name + "|" + (f.brand || ""); if (seen.has(key)) return;
    const hay = norm(f.name + " " + (f.brand || "") + " " + (f.barcode || ""));
    const hw = hay.split(/[^a-z0-9%]+/); if (words.every(w => hw.some(x => x.startsWith(w)))) { seen.add(key); res.push(f); }
  });
  return res.slice(0, 40);
}
function recentFoods() {

function suggestion(exId, excludeId) {
  const h = exerciseHistory(exId, excludeId); const [lo, hi] = repRange(exId); const inc = profile().increment;
  if (!h.length) return { text: `Première fois : trouve une charge pour ${lo}-${hi} reps à RIR 1-2.`, w: null };
  const last = h[0].sets; const topW = Math.max(...last.map(s => s.w));

  if (atTop.every(s => s.r >= hi)) return { text: `Toutes tes séries à ${topW} kg ont atteint ${hi} reps → monte à ${r1(topW + inc)} kg (ou le cran suivant) et vise ${lo}+ reps.`, w: r1(topW + inc), up: true };

function stalled(exId) {
  const h = exerciseHistory(exId); if (h.length < 4) return false;
  const best = h.map(x => Math.max(...x.sets.map(e1rm)));
  return Math.max(best[0], best[1], best[2]) <= best[3] * 1.005;

function weeklyVolume(daysBack = 7) {
  const since = Date.now() - daysBack * 864e5; const vol = {}; VOLUME_GROUPS.forEach(g => vol[g] = 0);
  workouts().forEach(w => {
    if (w.start < since) return;
    (w.ex || []).forEach(e => {
      const n = workSets(e).length; if (!n) return; const x = getEx(e.id);
      const prim = new Set(x.prim.map(m => MUSCLES[m]?.[1]).filter(Boolean));

async function shrinkImage(file, max = 1280) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const sc = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
}

const Store = {

  init() {

      const c = CFG();
      const r = await fetch(c.url + "/auth/v1/token?grant_type=refresh_token", { method: "POST", headers: { apikey: c.anon, "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: s.refresh_token }) });

function offToFood(p, code) {

}

function muscleSVG(prim = [], sec = [], focus = [], mini = false) {
  const cls = id => "m" + (prim.includes(id) ? " prim" : sec.includes(id) ? " sec" : "") + (focus.includes(id) ? " focus" : "");
  const shapes = (list, ox) => list.map(([id, cx, cy, rx, ry, rot, single]) => {
    const one = (x, r) => `<ellipse class="${cls(id)}" cx="${ox + x}" cy="${cy}" rx="${rx}" ry="${ry}" transform="rotate(${r} ${ox + x} ${cy})"><title>${MUSCLES[id][0]}</title></ellipse>`;
    return single ? one(cx, rot) : one(cx, rot) + one(100 - cx, -rot);
  }).join("");
  const sil = ox => {
    const L = (x1, y1, x2, y2, w) => `<line class="sil" x1="${ox + x1}" y1="${y1}" x2="${ox + x2}" y2="${y2}" stroke-width="${w}"/><line class="sil" x1="${ox + 100 - x1}" y1="${y1}" x2="${ox + 100 - x2}" y2="${y2}" stroke-width="${w}"/>`;
    return `<circle class="sil" cx="${ox + 50}" cy="13" r="8" stroke-width="1.2"/><path class="sil" stroke-width="1.2" d="M${ox + 33},27 Q${ox + 50},22 ${ox + 67},27 L${ox + 66},62 Q${ox + 63},86 ${ox + 64},100 L${ox + 36},100 Q${ox + 37},86 ${ox + 34},62 Z"/>` +
      L(30, 30, 24.5, 66, 1.2) + L(24.5, 66, 21, 100, 1.2) + L(43, 100, 42.5, 148, 1.2) + L(42.5, 148, 42, 192, 1.2);
  };
  return `<svg class="musc" viewBox="0 0 210 196" style="width:100%;max-width:420px;display:block;margin:auto">${sil(0)}${shapes(MUSC_FRONT, 0)}${sil(110)}${shapes(MUSC_BACK, 110)}

}

function viewWorkout() {
  const w = liveWorkout(); const mode = S.wMode || "list";

  if (mode === "3d") return `${statusBanner()}<div class="row between"><h1>${w ? esc(w.name) : "Salle 3D"}</h1>${w ? `<span class="mut" id="wTimer">${fmtDur(Date.now() - w.start)}</span>` : ""}</div>${toggle}
    <div id="scene3d" style="height:58vh;min-height:320px;border-radius:16px;overflow:hidden;background:#20242b"></div>
    <p class="xs mut c">Touche une machine → choisis l'exercice → note tes séries. Salle provisoire : je la referai à l'identique de la tienne avec tes photos.</p>
    ${w ? `<div class="card"><h3>Dans cette séance</h3>${(w.ex || []).map(e => `<div class="entry" data-act="gymPickEx" data-v="${e.id}"><span class="sm">${esc(getEx(e.id).name)}</span><span class="xs mut">${workSets(e).length} série(s) ›</span></div>`).join("") || `<p class="mut sm">Aucun exercice.</p>`}
      <button style="width:100%;margin-top:8px" data-act="finishW">Terminer la séance</button></div>` : ""}`;
  if (w) return toggle + liveView(w);
  const P = program(); const hist = workouts().filter(x => !x.live).slice(0, 30);
  return `${statusBanner()}<h1>Séance</h1>${toggle}
    <div class="card"><h2>Démarrer</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${Object.keys(P).map(n => `<button data-act="startW" data-v="${esc(n)}">${esc(n)}</button>`).join("")}</div>
    <p class="xs mut">Ton programme est préchargé. Tu peux changer d'exercice, en ajouter ou en enlever pendant la séance.</p></div>
    <div class="card"><h2>Historique</h2>${hist.map(h => {

function computeRecos() {
  const R = []; const T = targets(); const p = profile();
  const ks = [...Array(7)].map((_, i) => addDays(todayKey(), -1 - i)).filter(k => dayTotals(k).kcal >= 800);
  if (ks.length < 4) R.push({ l: "warn", t: "Note tes repas chaque jour", x: `Seulement ${ks.length} journée(s) bien notée(s) sur les 7 derniers jours. Le calcul adaptatif de ta dépense a besoin d'au moins 10 jours notés et de pesées régulières (3-4 par semaine minimum).` });
  if (ks.length) {
    const avg = f => ks.reduce((s, k) => s + dayTotals(k)[f], 0) / ks.length;
    const ap = avg("p"), ak = avg("kcal"), af = avg("fib");
    if (ap < T.p * 0.9) R.push({ l: "bad", t: "Protéines trop basses", x: `Moyenne ${r0(ap)} g/j pour une cible de ${T.p} g (${p.protPerKg} g/kg). Les méta-analyses (Morton 2018) situent le plafond d'efficacité vers 1,6 g/kg, jusqu'à 2,2 g/kg pour être large, surtout en léger déficit. Facile à corriger : skyr, whey, blanc de poulet, œufs.` });
    else R.push({ l: "good", t: "Protéines OK", x: `Moyenne ${r0(ap)} g/j (cible ${T.p} g).` });
    const diff = ak - T.kcal;
    if (Math.abs(diff) > T.kcal * 0.1) R.push({ l: "warn", t: diff > 0 ? "Au-dessus de ta cible calorique" : "En dessous de ta cible calorique", x: `Moyenne ${r0(ak)} kcal/j pour une cible de ${T.kcal} (${diff > 0 ? "+" : ""}${r0(diff)}).` });
    if (af < 25) R.push({ l: "warn", t: "Pas assez de fibres", x: `Moyenne ${r0(af)} g/j (repère EFSA : 25 g minimum, idéal ~30 g). Solution sans effort : un bol de gazpacho ou de velouté par jour (~250-300 ml), des lentilles ou pois chiches en bocal, des fruits rouges dans le skyr, des légumes surgelés poêlés 5 min.` });
  }
  const ws = weightSeries(28);
  if (ws.length > 10) {
    const a = ws[Math.max(0, ws.length - 15)].t, b = ws[ws.length - 1].t; const rate = (b - a) / a * 100 / 2; const [lo, hi] = GOALS[p.goal].rate;
    const msg = `Tendance : ${rate > 0 ? "+" : ""}${Math.round(rate * 100) / 100} % du poids par semaine. Repère pour « ${GOALS[p.goal].label} » : entre ${lo} et ${hi} %/sem.`;
    R.push({ l: rate < lo || rate > hi ? "warn" : "good", t: rate < lo || rate > hi ? "Rythme d'évolution du poids hors cible" : "Rythme du poids cohérent avec ton objectif", x: msg });
  }
  const vol = weeklyVolume(7); const hasW = workouts().some(w => !w.live && w.start > Date.now() - 7 * 864e5);
  if (hasW) {
    const low = VOLUME_GROUPS.filter(g => vol[g] > 0 && vol[g] < 8 && !["Avant-bras", "Lombaires", "Trapèzes", "Coiffe des rotateurs", "Adducteurs"].includes(g));
    if (low.length) R.push({ l: "warn", t: "Volume bas sur certains muscles", x: `${low.map(g => `${g} (${r1(vol[g])} séries)`).join(", ")}. Les études dose-réponse (Schoenfeld 2017) montrent plus d'hypertrophie vers 10-20 séries dures/semaine. Si un de ces muscles est une priorité, ajoute 2-4 séries par semaine.` });
    const legs = vol["Quadriceps"] + vol["Ischios"];
    if (legs < 4) R.push({ l: "warn", t: "Jambes peu travaillées cette semaine", x: "Le foot et le padel ne remplacent pas les séries lourdes pour l'hypertrophie des jambes." });
  }
  const stal = [...new Set(workouts().flatMap(w => (w.ex || []).map(e => e.id)))].filter(stalled);
  if (stal.length) R.push({ l: "warn", t: "Stagnation détectée", x: `${stal.map(id => getEx(id).name).join(", ")} : pas de progrès du 1RM estimé sur les 3 dernières séances. Pistes : vérifie le sommeil et les protéines, change de variante, ou fais une semaine allégée (deload, −40 % de volume).` });
  const sl = [...Array(7)].map((_, i) => Store.get("d-" + addDays(todayKey(), -i))?.sleep).filter(Boolean);
  if (sl.length >= 3) { const a = sl.reduce((x, y) => x + y, 0) / sl.length; if (a < 7) R.push({ l: "warn", t: "Sommeil court", x: `Moyenne ${r1(a)} h. En dessous de 7 h, la récupération et la composition corporelle en pâtissent (en déficit, moins de sommeil = plus de muscle perdu, Nedeltcheva 2010).` }); }
  return R;
}

const fridgeDoc = () => Store.get("fridge", {});
const fridgeItems = () => (fridgeDoc().items || []).filter(i => i && i.qty > 0);
function saveFridgeItems(items) { const d = clone(fridgeDoc()) || {}; d.items = items; Store.set("fridge", d); }
const normN = s => (s || "").toLowerCase().replace(/œ/g, "oe").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\(.*?\)/g, "").trim();
const qtyTxt = it => it.unit === "pc" ? `${r1(it.qty)} pièce${it.qty > 1 ? "s" : ""}` : it.qty >= 1000 ? `${r1(it.qty / 1000)} kg` : `${r0(it.qty)} g`;
function fridgeFind(name) {
  const n = normN(name); if (!n) return null;
  const items = fridgeItems();
  const W = s => s.split(/[^a-z0-9]+/).filter(w => w.length > 2 && !["les", "des", "aux", "avec", "cuit", "cru", "crue", "cuite"].includes(w));
  const nw = W(n);
  return items.find(i => normN(i.name) === n) || items.find(i => { const mw = W(normN(i.name)); if (!mw.length || !nw.length) return false; const [a, b] = mw.length <= nw.length ? [mw, nw] : [nw, mw]; return a.every(w => b.some(x => x === w || x === w + "s" || w === x + "s")); }) || null;
}
// quand il mange quelque chose qui est dans le frigo, on le retire
function fridgeConsume(name, g) {
  const it = fridgeFind(name); if (!it || !(g > 0)) return null;
  const items = clone(fridgeDoc().items || []); const x = items.find(i => i.id === it.id);
  x.qty = x.unit === "pc" ? x.qty - g / (x.gPerPc || 100) : x.qty - g;
  if (x.qty <= 0.05) x.qty = 0;
  saveFridgeItems(items.filter(i => i.qty > 0));
  return x;
}
function fridgeAdd(list) {
  const items = clone(fridgeDoc().items || []);
  list.forEach(n => {
    const ex = items.find(i => normN(i.name) === normN(n.name) && i.unit === n.unit && (i.zone || "frigo") === (n.zone || "frigo"));
    if (ex) ex.qty += n.qty; else items.push(Object.assign({ id: uid(), added: Date.now(), zone: "frigo", unit: "g" }, n, { cat: n.cat || guessCat(n.name) }));
  });
  saveFridgeItems(items);
}
function fridgeText() { return fridgeItems().map(i => `${i.name} (${qtyTxt(i)}, ${FRIDGE_ZONES[i.zone || "frigo"]})`).join(", "); }

  saveDaily: () => { updDay(d => { const w = parseFloat($("#inW").value), st = parseInt($("#inSteps").value), sl = parseFloat($("#inSleep").value); d.weight = w > 0 ? w : null; d.steps = st > 0 ? st : null; d.sleep = sl > 0 ? sl : null; }); toast("Enregistré"); },

  addAct: () => { const type = $("#actType").value, min = +$("#actMin").value; if (!min) return; const kcal = ACTIVITIES[type] * latestWeight() * min / 60 * 0.85; updDay(d => d.acts.push({ type, min, kcal })); },
  delAct: el => updDay(d => d.acts.splice(+el.dataset.v, 1)),
  toggleIncomplete: el => updDay(d => d.incomplete = el.checked),
  aiFinish: async () => {
    const t = dayTotals(S.day), T = targets(); const eaten = day(S.day).entries.map(e => `${e.meal}: ${e.name} ${e.g} g`).join("; ") || "rien";

    try { await aiText(`${USER_CTX()}\nAujourd'hui il a déjà mangé : ${eaten}. Total : ${r0(t.kcal)} kcal, P ${r0(t.p)} g, G ${r0(t.c)} g, L ${r0(t.f)} g, fibres ${r0(t.fib)} g. Il est ${new Date().getHours()} h.\nIl lui reste : ${r0(T.kcal - t.kcal)} kcal, P ${r0(T.p - t.p)} g, G ${r0(T.c - t.c)} g, L ${r0(T.f - t.f)} g.\nCe qu'il a dans son frigo/placard : ${fridgeText() || "inconnu"}. Propose 2 options concrètes pour finir la journée, en privilégiant ce qu'il a déjà. ${CHEF_RULES} Si le budget est déjà dépassé, dis-le simplement et propose comment compenser demain sans extrême. Réponds en français, court, sans markdown lourd.`, txt => { S.aiOut.today = txt; const o = $(".ai-out"); if (o) o.textContent = txt; }); }

  aiFridgeGo: async () => {
    const txt = $("#fridge").value.trim(); if (!txt && !fridgeItems().length) return; if ($("#fridgeKeep").checked) Store.set("fridge", Object.assign(clone(fridgeDoc()) || {}, { txt }));

    try { await aiText(`${USER_CTX()}\nIl a chez lui : ${txt}${fridgeText() ? ". Inventaire de son frigo : " + fridgeText() : ""}.\nIl lui reste aujourd'hui ${r0(T.kcal - t.kcal)} kcal et ${r0(T.p - t.p)} g de protéines.\nPropose 1 à 2 recettes faites avec ces ingrédients (il peut manquer au plus 1-2 basiques : sel, épices, huile), qui intègrent des légumes sans effort. ${CHEF_RULES} Ajoute à la fin la version batch pour 3-4 jours (quantités ×, conservation au frigo/congélateur, réchauffage).`, txt2 => { S.aiOut.fridge = txt2; const o = $("#fridgeOut"); if (o) { o.className = "ai-out"; o.textContent = txt2; } }); }

  },
  // ----- séance
  startW: el => { const n = el.dataset.v; const P = program()[n] || { ex: [] }; const id = "w-" + Date.now(); S.draft = {}; S.warmOpen = !!P.warmup;
    Store.set(id, { live: true, name: n, start: Date.now(), ex: P.ex.map(e => ({ id: e, sets: [] })), warm: {}, notes: "" }); scheduleTimer(); },
  toggleWarm: () => { S.warmOpen = !S.warmOpen; render(); },
  warmChk: el => updW(w => { w.warm = w.warm || {}; w.warm[el.dataset.v] = el.checked; }),
  showMusc: el => openSheet(exMuscleSheet(el.dataset.v)),
  dStep: el => { const i = +el.dataset.i, k = el.dataset.k; const dr = S.draft[i]; const inp = $(`input[data-input=draft][data-i="${i}"][data-k="${k}"]`); let cur = parseFloat(inp?.value); if (isNaN(cur)) cur = k === "r" ? repRange(liveWorkout().ex[i].id)[1] - +el.dataset.v : 0; dr[k] = Math.max(0, r1(cur + +el.dataset.v)); render(); },
  dRir: el => { const dr = S.draft[+el.dataset.i]; dr.rir = +el.dataset.v; dr.wu = false; render(); },
  dWu: el => { const dr = S.draft[+el.dataset.i]; dr.wu = !dr.wu; render(); },
  logSet: el => {
    const i = +el.dataset.i; const dr = S.draft[i];
    const wv = parseFloat($(`input[data-input=draft][data-i="${i}"][data-k="w"]`).value), rv = parseInt($(`input[data-input=draft][data-i="${i}"][data-k="r"]`).value);
    if (!(rv > 0) || isNaN(wv)) { toast("Indique la charge et les reps"); return; }
    dr.w = wv; dr.r = "";
    updW(w => w.ex[i].sets.push({ w: wv, r: rv, rir: dr.wu ? null : dr.rir, wu: !!dr.wu, t: Date.now() }));
    if (dr.wu) dr.wu = false;
    const h = exerciseHistory(liveWorkout().ex[i].id, liveWorkout()._id); const best = h.flatMap(x => x.sets).reduce((b, s) => Math.max(b, e1rm(s)), 0);
    if (!dr.wu && best && e1rm({ w: wv, r: rv }) > best) toast("🏆 Nouveau record (1RM estimé) !");
  },
  delSet: el => updW(w => w.ex[+el.dataset.i].sets.splice(+el.dataset.j, 1)),
  rmEx: el => { const i = +el.dataset.i; updW(w => w.ex.splice(i, 1)); S.draft = {}; },
  exUp: el => { const i = +el.dataset.i; if (!i) return; updW(w => { const t = w.ex[i]; w.ex[i] = w.ex[i - 1]; w.ex[i - 1] = t; }); S.draft = {}; },
  swapEx: el => openSheet(exPickerSheet("swap", +el.dataset.i)),
  addEx: () => { S.exQ = ""; openSheet(exPickerSheet("add")); },
  pickEx: el => { const id = el.dataset.v; if (el.dataset.mode === "swap") { const i = +el.dataset.i; updW(w => { w.ex[i].id = id; }); delete S.draft[i]; } else updW(w => w.ex.push({ id, sets: [] })); closeSheet(); },
  createEx: () => { const name = $("#newExName").value.trim(); if (!name) return; const m = $("#newExMuscle").value; const id = "c_" + uid();
    const doc = clone(Store.get("program", {})); doc.customEx = doc.customEx || {}; doc.customEx[id] = { id, name, cat: "Mes exercices", prim: [m], sec: [], focus: [m] }; Store.set("program", doc);
    updW(w => w.ex.push({ id, sets: [] })); closeSheet(); },
  finishW: () => { const notes = $("#wNotes")?.value || ""; updW(w => { w.live = false; w.end = Date.now(); w.notes = notes; w.ex = w.ex.filter(e => (e.sets || []).length); }); clearInterval(window._wt); S.draft = {}; toast("Séance enregistrée 💪"); },
  cancelW: () => openSheet(() => `<h2>Abandonner la séance ?</h2><p class="sm mut">Les séries notées seront supprimées.</p><div class="row"><button class="sec grow" data-act="closeSheet">Non</button><button class="grow" style="background:var(--red)" data-act="cancelWok">Oui, supprimer</button></div>`),
  cancelWok: () => { const w = liveWorkout(); if (w) Store.del(w._id); S.draft = {}; closeSheet(); },
  openHist: el => openSheet(histSheet(el.dataset.v)),
  delW: el => { Store.del(el.dataset.v); closeSheet(); },
  wMode: el => { S.wMode = el.dataset.v; render(); },
  gymPickEx: el => {
    const id = el.dataset.v; let w = liveWorkout();
    if (!w) { const wid = "w-" + Date.now(); Store.set(wid, { live: true, name: "Séance", start: Date.now(), ex: [], warm: {}, notes: "" }); scheduleTimer(); w = liveWorkout(); }
    if (!(w.ex || []).some(e => e.id === id)) updW(o => o.ex.push({ id, sets: [] }));
    openSheet(gymExSheet(id));
  },
  // ----- frigo
  fridgeEdit: el => openSheet(fridgeItemSheet(el.dataset.v)),
  fridgeSave: el => { const items = clone(fridgeDoc().items || []); const it = items.find(i => i.id === el.dataset.v); if (!it) return;
    it.qty = parseFloat($("#fiQ").value) || 0; it.unit = $("#fiU").value; it.gPerPc = parseFloat($("#fiP").value) || null; it.zone = $("#fiZ").value; it.cat = $("#fiC").value;
    saveFridgeItems(items.filter(i => i.qty > 0)); closeSheet(); },
  fridgeDel: el => { saveFridgeItems((fridgeDoc().items || []).filter(i => i.id !== el.dataset.v)); closeSheet(); },
  fridgeEat: el => openSheet(fridgeEatSheet(el.dataset.v)),
  fridgeEatGo: async el => {
    const it = (fridgeDoc().items || []).find(i => i.id === el.dataset.v); if (!it) return; const g = parseFloat($("#feG").value); const meal = $("#feM").value; if (!(g > 0)) return;
    let food = it.per100 ? { name: it.name, per100: it.per100, micro100: it.micro100, src: "frigo" } : allFoods().find(f => normN(f.name) === normN(it.name));
    if (!food) { S.busy.eat = true; renderSheet(); try { const r = await aiMealText(`${g} g de ${it.name}`); const x = itemsFromAI(r)[0]; if (x) food = { name: it.name, per100: x.per100, micro100: x.micro100, src: "ia" }; } catch (e) { toast(aiErr(e)); } S.busy.eat = false; }
    if (!food) { renderSheet(); return; }
    const k = todayKey(); const d = clone(day(k)); d.entries = d.entries || []; d.acts = d.acts || []; d.entries.push(makeEntry(food, g, meal)); saveDay(k, d);
    fridgeConsume(it.name, g); toast(`${it.name} : ${r0(g)} g ajouté au journal`); closeSheet(); },
  fridgeAddOpen: () => { S.fq = ""; openSheet(fridgeAddSheet); },
  fridgePick: el => { const i = +el.dataset.i; const f = i < 0 ? { name: S.fq } : S._fres[i]; S._fpick = f; openSheet(fridgeQtySheet(f)); },
  fridgeQtyGo: () => { const f = S._fpick; const q = parseFloat($("#fqQ").value); if (!(q > 0)) return;
    fridgeAdd([{ name: f.name, qty: q, unit: $("#fqU").value, gPerPc: parseFloat($("#fqP").value) || null, zone: $("#fqZ").value, per100: f.per100 || null, micro100: f.micro100 || null }]); toast("Rangé dans le frigo"); closeSheet(); },
  fridgeShop: () => { S.shop = {}; openSheet(fridgeShopSheet); },
  shopGo: async () => { const txt = $("#shopTxt").value.trim(); if (!txt) return; S.shop.txt = txt; S.shop.busy = true; S.shop.err = ""; renderSheet();
    try { const r = await aiShop(txt); S.shop.items = (r?.items || []).filter(x => x && x.name && x.qty > 0); if (!S.shop.items.length) S.shop.err = "Rien reconnu."; } catch (e) { S.shop.err = aiErr(e); }
    S.shop.busy = false; renderSheet(); },
  shopDel: el => { S.shop.items.splice(+el.dataset.v, 1); renderSheet(); },
  shopReset: () => { S.shop = { txt: S.shop.txt }; renderSheet(); },
  shopAdd: () => { fridgeAdd(S.shop.items.map(x => ({ name: x.name, qty: +x.qty, unit: x.unit === "pc" ? "pc" : "g", gPerPc: x.gPerPc || null, cat: FRIDGE_CATS[x.cat] ? x.cat : guessCat(x.name), zone: FRIDGE_ZONES[x.zone] ? x.zone : "frigo", per100: x.per100 || null })));
    toast(`${S.shop.items.length} aliment(s) rangé(s)`); S.shop = {}; closeSheet(); },
  // ----- coach
  aiWeek: async () => {
    S.busy.week = true; S.aiOut.week = "…"; render();
    try { await aiText(`${USER_CTX()}\nVoici ses données des 7 derniers jours (JSON) :\n${JSON.stringify(weekSummary())}\n\nFais un bilan hebdomadaire en français, ton neutre et scientifique : 1) ce qui va bien, 2) les 3 priorités concrètes pour la semaine prochaine (nutrition et entraînement, avec chiffres), 3) une remarque sur la progression des charges. Appuie-toi sur le consensus scientifique (méta-analyses récentes : volume, proximité de l'échec, protéines, déficit modéré) et cite brièvement l'étude quand c'est utile. Pas de blabla, pas de markdown lourd. Si des données manquent, dis-le en une phrase.`, txt => { S.aiOut.week = txt; const o = $$(".ai-out")[0]; if (o && S.tab === "coach") o.textContent = txt; }, "complex"); }
    catch (e) { S.aiOut.week = aiErr(e); }
    S.busy.week = false; render();
  },
  chatSend: async () => {
    const q = $("#chatIn").value.trim(); if (!q) return;
    S.chat.push({ role: "user", content: q }); S.chat.push({ role: "assistant", content: "…" }); S.busy.chat = true; render();
    const transcript = S.chat.slice(0, -1).map(m => (m.role === "user" ? "Lui : " : "Toi : ") + m.content).join("\n");
    try { const txt = await aiText(`${USER_CTX()}\nRésumé de sa semaine (JSON) : ${JSON.stringify(weekSummary())}\nTu es son coach musculation/nutrition. Réponds en français, de façon neutre, scientifique et concise, en t'appuyant sur les études (cite-les brièvement). Pas de markdown lourd.\nConversation :\n${transcript}\nRéponds à sa dernière question.`, t => { S.chat[S.chat.length - 1].content = t; const os = $$(".ai-out"); if (os.length) os[os.length - 1].textContent = t; });
      S.chat[S.chat.length - 1].content = txt; }
    catch (e) { S.chat[S.chat.length - 1].content = aiErr(e); }
    S.busy.chat = false; render();
  },
  chatClear: () => { S.chat = []; render(); },
  // ----- profil
  setGoal: el => { Store.set("profile", Object.assign({}, Store.get("profile", {}), { goal: el.dataset.v })); toast("Objectif : " + GOALS[el.dataset.v].label); },
  saveProfile: () => { const p = Object.assign({}, Store.get("profile", {}));
    ["age", "height", "weight", "protPerKg", "fatPerKg", "increment"].forEach(k => { const v = parseFloat($("#p_" + k).value); if (v > 0) p[k] = v; });
    const mk = parseFloat($("#p_manualKcal").value); p.manualKcal = mk > 0 ? mk : null; p.activity = parseFloat($("#p_activity").value);
    Store.set("profile", p); toast("Profil enregistré"); },
  exportData: async () => { try { await navigator.clipboard.writeText(JSON.stringify(Store.docs)); toast("Sauvegarde copiée : colle-la dans une note"); } catch (e) { toast("Copie refusée par le navigateur"); } },
  importData: () => openSheet(() => `<h2>Restaurer une sauvegarde</h2><p class="sm mut">Colle le texte copié avec « Copier une sauvegarde ». Les documents existants avec le même nom seront remplacés.</p><textarea id="impTxt"></textarea><div class="row" style="margin-top:8px"><button class="sec grow" data-act="closeSheet">Annuler</button><button class="grow" data-act="importGo">Restaurer</button></div>`),
  importGo: () => { try { const o = JSON.parse($("#impTxt").value); Object.entries(o).forEach(([k, v]) => { if (v && typeof v === "object") Store.set(k, v); }); toast("Restauré"); closeSheet(); } catch (e) { toast("Texte invalide"); } },
};

// ----- code-barres
let _zx = null;
function loadZXing() { if (_zx) return _zx; _zx = new Promise(res => { const s = document.createElement("script"); s.src = "vendor/zxing.min.js"; s.onload = () => res(window.ZXing || null); s.onerror = () => res(null); document.head.appendChild(s); setTimeout(() => res(window.ZXing || null), 8000); }); return _zx; }
async function decodeBarcode(file) {
  try { const Z = await loadZXing(); if (!Z) return null; const url = URL.createObjectURL(file);
    const hints = new Map(); hints.set(Z.DecodeHintType.TRY_HARDER, true);
    const reader = new Z.BrowserMultiFormatReader(hints); const r = await reader.decodeFromImageUrl(url); return r?.getText?.() || r?.text || null; } catch (e) { return null; }
}
async function handleBarcode(code) {
  const f = myFoods()["bc" + code];
  if (f) { S.add.sel = f; S.add.g = f.unit || 100; S.add.busy = false; renderSheet(); return; }
  S.add.busy = true; renderSheet();
  const off = await offBarcode(code);
  if (off) { const saved = saveMyFood(off); toast("Produit trouvé : " + off.name); S.add.sel = saved; S.add.g = saved.unit || 100; S.add.busy = false; renderSheet(); return; }
  S.add.scan = { step: "label", barcode: code }; S.add.busy = false; renderSheet();
}
async function onFile(kind, file) {
  if (!file) return; S.add.err = "";
  if (kind === "shop") { S.shop.busy = true; S.shop.err = ""; renderSheet(); try { const b = await shrinkImage(file, 1600); const r = await aiShop("", b); S.shop.items = (r?.items || []).filter(x => x && x.name && x.qty > 0); if (!S.shop.items.length) S.shop.err = "Rien reconnu sur la photo."; } catch (e) { S.shop.err = aiErr(e); } S.shop.busy = false; renderSheet(); return; }
  if (kind === "photo") { S.add.blob = await shrinkImage(file); S.add.img = URL.createObjectURL(S.add.blob); renderSheet(); return; }
  if (kind === "barcode") {
    S.add.busy = true; renderSheet();
    let code = await decodeBarcode(file);
    if (!code) { try { const small = await shrinkImage(file, 1600); const r = await aiBarcodeDigits(small); code = (r?.barcode || "").replace(/\D/g, ""); } catch (e) { S.add.err = aiErr(e); } }
    if (!code) { S.add.busy = false; S.add.err = S.add.err || "Code illisible : reprends la photo plus près, ou tape le code."; renderSheet(); return; }
    handleBarcode(code); return;
  }
  if (kind === "label") {
    S.add.busy = true; renderSheet();
    try { const blob = await shrinkImage(file, 1600); const r = await aiLabel(blob);
      const per100 = Object.fromEntries(NUTR_KEYS.map(k => [k, r?.per100?.[k] == null ? 0 : +r.per100[k]]));
      if (!per100.kcal && !per100.p && !per100.c) throw { message: "étiquette illisible, reprends la photo bien à plat" };
      const code = S.add.scan?.barcode || (r.barcode || "").replace(/\D/g, "") || null;
      const food = saveMyFood({ name: r.name || "Produit scanné", brand: r.brand || "", barcode: code, per100, unit: r.servingG || null });
      toast("Produit enregistré dans tes aliments"); S.add.sel = food; S.add.g = food.unit || 100; S.add.scan = null;
    } catch (e) { S.add.err = e?.code ? aiErr(e) : "Erreur : " + (e?.message || ""); }
    S.add.busy = false; renderSheet();
  }
}

// ===================== ÉVÉNEMENTS =====================
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act; if (el.tagName === "SELECT" || (el.tagName === "INPUT" && el.type === "checkbox")) return;
  if (ACT[a]) { if (a !== "closeSheetBg") ev.preventDefault(); ACT[a](el, ev); }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset.file) { onFile(el.dataset.file, el.files?.[0]); el.value = ""; return; }
  if (el.dataset.act === "range") { const [a, b] = el.value.split("-").map(Number); const doc = clone(Store.get("program", {})); doc.ranges = doc.ranges || {}; doc.ranges[el.dataset.v] = [a, b]; Store.set("program", doc); return; }
  if (el.dataset.act === "progEx") { S.progEx = el.value; render(); return; }
  if (el.id === "wDate") { const w = liveWorkout(); if (w && el.value) { const t = new Date(w.start); const d = parseKey(el.value); d.setHours(t.getHours(), t.getMinutes()); const delta = d.getTime() - w.start; updW(o => { o.start += delta; o.ex.forEach(e => e.sets.forEach(s => s.t += delta)); }); } return; }
  if (el.dataset.act === "warmAll") { updW(w => w.warmDone = el.checked); return; }
  if (el.type === "checkbox" && el.dataset.act && ACT[el.dataset.act]) ACT[el.dataset.act](el, ev);
});
document.addEventListener("input", ev => {
  const el = ev.target; const k = el.dataset.input; if (!k) return;
  if (k === "q") { S.add.q = el.value; S.add.offRes = null; _searchRes = searchFoods(el.value); $("#qres").innerHTML = foodList(_searchRes); }
  else if (k === "g") { S.add.g = +el.value; const f = S.add.sel, n = scaleNutr(f.per100, +el.value || 0); $("#selN").innerHTML = `<b>${r0(n.kcal)} kcal</b> · P ${r1(n.p)} g · G ${r1(n.c)} g · L ${r1(n.f)} g`; }
  else if (k === "itemG") { S.add.items[+el.dataset.i].grams = +el.value || 0; }
  else if (k === "fq") { S.fq = el.value; const res = searchFoods(el.value).slice(0, 12); S._fres = res; $("#fres").innerHTML = fridgeResHTML(res, el.value); }
  else if (k === "shopQ") { S.shop.items[+el.dataset.i].qty = +el.value || 0; }
  else if (k === "draft") { const dr = S.draft[+el.dataset.i]; if (dr) dr[el.dataset.k] = el.value; }
  else if (k === "exQ") { S.exQ = el.value; const sh = exPickerSheet("add")(); const tmp = document.createElement("div"); tmp.innerHTML = sh; $("#exList").innerHTML = tmp.querySelector("#exList").innerHTML; }
});
// recalcul de la liste de recherche quand la feuille s'affiche
const _origRenderSheet = renderSheet;
renderSheet = function () { if (S.sheet === addSheet && !S.add.sel && !S.add.items && S.add.tab === "search") _searchRes = S.add.offRes || searchFoods(S.add.q); _origRenderSheet(); };

Object.assign(ACT, PLATFORM_ACT);
ACT_PICK_MACHINE = id => openSheet(machineSheet(id));
ACT_PICK_FRIDGE = id => openSheet(fridgeItemSheet(id));
Store.on(() => { render(); if (liveWorkout()) scheduleTimer(); });
render();
Store.init();

</script></body></html>
