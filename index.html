  const out = []; if (f.unit) out.push([f.src === "off" || f.src === "perso" ? "1 portion (paquet)" : "1 portion", f.unit]);
  const hit = PORTIONS.find(([re]) => re.test(f.name)); if (hit) hit[1].forEach(p => out.push(p));
  if (f.lastG) out.push(["Dernière fois", f.lastG]);
  out.push(["100 g", 100]);
  const seen = new Set(); return out.filter(([l, g]) => { const k = l + g; if (seen.has(k)) return false; seen.add(k); return true; });
}

function bmr(p, w) { return 10 * w + 6.25 * p.height - 5 * p.age + (p.sex === "f" ? -161 : 5); }

// Série de poids lissée (tendance, moyenne mobile exponentielle)
function weightSeries(days = 120) {
  const out = []; let trend = null; const end = todayKey();
  for (let i = days; i >= 0; i--) {
    const k = addDays(end, -i); const w = Store.get("d-" + k)?.weight;
    if (w) trend = trend == null ? w : trend + 0.1 * (w - trend);
    if (trend != null) out.push({ k, w: w || null, t: trend });
  }
  return out;
}
function dayTotals(k) {
  const d = day(k); const t = {}; NUTR_KEYS.forEach(n => t[n] = 0); t.micro = {};
  (d.entries || []).forEach(e => {
    NUTR_KEYS.forEach(n => t[n] += e.n?.[n] || 0);
    Object.entries(e.micro || {}).forEach(([m, v]) => t.micro[m] = (t.micro[m] || 0) + (+v || 0));
  });
  t.actKcal = (d.acts || []).reduce((s, a) => s + (a.kcal || 0), 0);
  return t;
}
// Estimation adaptative de la dépense (type MacroFactor) : apports réels vs évolution du poids
function adaptiveTDEE() {
  const end = addDays(todayKey(), -1); const N = 28; const intake = []; const pts = [];
  for (let i = N - 1; i >= 0; i--) {
    const k = addDays(end, -i); const t = dayTotals(k); const d = Store.get("d-" + k);
    if (t.kcal >= 1200 && !(d && d.incomplete)) intake.push(t.kcal);
    if (d?.weight) pts.push([N - 1 - i, d.weight]);
  }
  if (intake.length < 10 || pts.length < 4 || pts[pts.length - 1][0] - pts[0][0] < 10) return { ok: false, days: intake.length, weighs: pts.length };
  const n = pts.length, sx = pts.reduce((s, p) => s + p[0], 0), sy = pts.reduce((s, p) => s + p[1], 0);
  const sxx = pts.reduce((s, p) => s + p[0] * p[0], 0), sxy = pts.reduce((s, p) => s + p[0] * p[1], 0);
  const slope = (n * sxy - sx * sy) / (n * sxx - sx * sx); // kg/jour
  const avg = intake.reduce((a, b) => a + b, 0) / intake.length;
  return { ok: true, tdee: avg - slope * 7700, avgIntake: avg, slopeWeek: slope * 7, days: intake.length, weighs: pts.length };
}
function targets() {
  const p = profile(); const w = latestWeight();
  const formula = bmr(p, w) * p.activity;
  const ad = adaptiveTDEE();
  let tdee = formula, source = "formule (Mifflin-St Jeor × activité)";
  if (ad.ok) { tdee = Math.min(formula * 1.25, Math.max(formula * 0.75, ad.tdee)); source = `adaptative : tes apports réels et l'évolution de ton poids sur ${ad.days} j`; }
  let kcal = tdee * (1 + GOALS[p.goal].factor);
  if (ad.ok && p.autoAdjust !== false && typeof weeklyAdjust === "function") { const A = weeklyAdjust(tdee, GOALS[p.goal].factor, ad); kcal = A.kcal; source = `ajustée chaque lundi d'après tes vraies données (${ad.days} j)`; }
  if (p.manualKcal) { kcal = +p.manualKcal; source = "valeur manuelle"; }
  const prot = p.protPerKg * w, fat = Math.max(p.fatPerKg * w, kcal * 0.2 / 9);
  const carb = Math.max(0, (kcal - prot * 4 - fat * 9) / 4);
  return { kcal: r0(kcal), p: r0(prot), f: r0(fat), c: r0(carb), fib: 30, tdee: r0(tdee), formula: r0(formula), adaptive: ad, source, weight: w };
}

const myFoods = () => Store.get("foods", { items: {} }).items || {};
function allFoods() { return [...Object.values(myFoods()), ...FOODS_BASE]; }
function scaleNutr(per100, g) { const o = {}; NUTR_KEYS.forEach(k => { if (per100[k] != null) o[k] = (+per100[k] || 0) * g / 100; }); return o; }
function searchFoods(q) {
  const norm = s => s.toLowerCase().replace(/œ/g, "oe").normalize("NFD").replace(/[̀-ͯ]/g, "");
  const words = norm(q).split(/\s+/).filter(Boolean);
  const recents = recentFoods();
  if (!words.length) return recents.slice(0, 15);
  const seen = new Set(); const res = [];
  [...recents, ...allFoods()].forEach(f => {
    const key = f.name + "|" + (f.brand || ""); if (seen.has(key)) return;
    const hay = norm(f.name + " " + (f.brand || "") + " " + (f.barcode || ""));
    const hw = hay.split(/[^a-z0-9%]+/); if (words.every(w => hw.some(x => x.startsWith(w)))) { seen.add(key); res.push(f); }
  });
  return res.slice(0, 40);
}
function recentFoods() {
  const ks = Store.ids("d-").sort().reverse().slice(0, 21); const seen = new Set(); const out = [];
  ks.forEach(k => (Store.get(k).entries || []).slice().reverse().forEach(e => {
    if (!e.per100 || seen.has(e.name)) return; seen.add(e.name);
    out.push({ id: "r-" + e.name, name: e.name, brand: e.brand, per100: e.per100, unit: e.unit, micro100: e.micro100, src: "récent", lastG: e.g });
  }));
  return out;
}

const e1rm = s => s.w * (1 + s.r / 30); // Epley
function exerciseHistory(exId, excludeId) {
  const out = [];
  workouts().forEach(w => { if (w._id === excludeId) return; (w.ex || []).forEach(e => { if (e.id === exId && workSets(e).length) out.push({ date: w.start, sets: workSets(e), wid: w._id }); }); });
  return out; // plus récent d'abord
}
function suggestion(exId, excludeId) {
  const h = exerciseHistory(exId, excludeId); const [lo, hi] = repRange(exId); const inc = profile().increment;
  if (!h.length) return { text: `Première fois : trouve une charge pour ${lo}-${hi} reps à RIR 1-2.`, w: null };
  const last = h[0].sets; const topW = Math.max(...last.map(s => s.w));
  const atTop = last.filter(s => s.w === topW);
  if (atTop.every(s => s.r >= hi)) return { text: `Toutes tes séries à ${topW} kg ont atteint ${hi} reps → monte à ${r1(topW + inc)} kg (ou le cran suivant) et vise ${lo}+ reps.`, w: r1(topW + inc), up: true };
  if (atTop.some(s => s.r < lo)) return { text: `En dessous de ${lo} reps la dernière fois : garde ${topW} kg et vise ${lo}-${hi} reps.`, w: topW };
  return { text: `Garde ${topW} kg et essaie de faire +1 rep sur chaque série (objectif ${hi} reps partout).`, w: topW };
}
function stalled(exId) {
  const h = exerciseHistory(exId); if (h.length < 4) return false;
  const best = h.map(x => Math.max(...x.sets.map(e1rm)));
  return Math.max(best[0], best[1], best[2]) <= best[3] * 1.005;
}
function weeklyVolume(daysBack = 7) {
  const since = Date.now() - daysBack * 864e5; const vol = {}; VOLUME_GROUPS.forEach(g => vol[g] = 0);
  workouts().forEach(w => {
    if (w.start < since) return;
    (w.ex || []).forEach(e => {
      const n = workSets(e).length; if (!n) return; const x = getEx(e.id);
      const prim = new Set(x.prim.map(m => MUSCLES[m]?.[1]).filter(Boolean));
      const sec = new Set(x.sec.map(m => MUSCLES[m]?.[1]).filter(g => g && !prim.has(g)));
      prim.forEach(g => vol[g] += n); sec.forEach(g => vol[g] += n * 0.5);
    });
  });
  return vol;
}

async function shrinkImage(file, max = 1280) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const sc = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
}

const Sync = {
  sess() { return LS.get("muscu_sess", null); },
  setSess(s) { LS.set("muscu_sess", s); Store.mode = s ? "cloud" : "local"; },
  async api(path, opts = {}) {
    const c = CFG(); const s = await this.token();
    const r = await fetch(c.url + path, Object.assign({}, opts, { headers: Object.assign({ apikey: c.anon, Authorization: "Bearer " + (s ? s.access_token : c.anon), "Content-Type": "application/json" }, opts.headers || {}) }));
    if (!r.ok) { let m = r.status + ""; try { const j = await r.json(); m = j.msg || j.message || j.error_description || j.error || m; } catch (e) {} throw new Error(m); }
    return r.status === 204 ? null : r.json().catch(() => null);
  },
  async auth(kind, email, password) {
    const c = CFG(); const path = kind === "signup" ? "/auth/v1/signup" : "/auth/v1/token?grant_type=password";
    const r = await fetch(c.url + path, { method: "POST", headers: { apikey: c.anon, "Content-Type": "application/json" }, body: JSON.stringify({ email, password }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.msg || j.error_description || j.message || "Erreur " + r.status);
    if (!j.access_token) throw new Error("Compte créé : confirme ton e-mail puis connecte-toi.");
    this.setSess({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, user: { id: j.user?.id, email: j.user?.email } });

  },
  logout() { this.setSess(null); Store.emit(); },
  async token() {
    let s = this.sess(); if (!s) return null;
    if (Date.now() > s.expires_at - 60000) {
      const c = CFG();
      const r = await fetch(c.url + "/auth/v1/token?grant_type=refresh_token", { method: "POST", headers: { apikey: c.anon, "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
      if (!r.ok) { if (r.status === 400 || r.status === 401) { this.setSess(null); throw new Error("reconnecte-toi dans Profil"); } throw new Error("connexion"); }
      const j = await r.json(); s = Object.assign(s, { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000 }); this.setSess(s);
    }
    return s;
  },
  soon() { clearTimeout(this._t); this._t = setTimeout(() => this.run(), 1500); },
  async run(force) {
    const c = CFG(); const s = this.sess(); Store.mode = s ? "cloud" : "local";
    if (!c.url || !s || !navigator.onLine || (Store.syncing && !force)) return;
    Store.syncing = true;
    try {
      const sess = await this.token(); if (!sess) return;
      // 1) récupérer les changements faits sur l'autre appareil
      const since = Store.meta.lastPull || "1970-01-01T00:00:00Z"; let changed = false; const remoteIds = new Set();
      for (let page = 0; page < 50; page++) {
        const rows = await this.api(`/rest/v1/docs?select=id,data,deleted,server_ts&server_ts=gt.${encodeURIComponent(Store.meta.lastPull || since)}&order=server_ts.asc&limit=500`);
        if (!rows || !rows.length) break;
        rows.forEach(r => { remoteIds.add(r.id); if (Store.meta.dirty[r.id]) return; if (r.deleted) delete Store.docs[r.id]; else Store.docs[r.id] = r.data; changed = true; Store.meta.lastPull = r.server_ts; });
        Store.meta.lastPull = rows[rows.length - 1].server_ts; if (rows.length < 500) break;
      }
      if (Store.meta.firstSync) { Object.keys(Store.docs).forEach(k => { if (!remoteIds.has(k) && Store.docs[k]) { Store.meta.dirty[k] = true; Store.meta.upd[k] = Store.meta.upd[k] || Date.now(); } }); Store.meta.firstSync = false; }
      // 2) envoyer ce qui a été modifié ici
      const ids = Object.keys(Store.meta.dirty);
      for (let i = 0; i < ids.length; i += 100) {
        const chunk = ids.slice(i, i + 100);
        const rows = chunk.map(id => ({ user_id: sess.user.id, id, data: Store.docs[id] ?? null, deleted: Store.docs[id] == null, updated_at: new Date(Store.meta.upd[id] || Date.now()).toISOString() }));
        await this.api("/rest/v1/docs?on_conflict=user_id,id", { method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(rows) });
        chunk.forEach(id => { delete Store.meta.dirty[id]; if (Store.docs[id] === null) delete Store.docs[id]; });
      }
      Store.syncErr = ""; Store.lastSync = Date.now(); Store.persist(); if (changed || ids.length) Store.emit();
    } catch (e) { Store.syncErr = e.message || "erreur réseau"; Store.emit(); }
    finally { Store.syncing = false; }
  }
};

  const key = aiSettings().geminiKey;

  if (!navigator.onLine) throw { code: "offline", message: "Pas de connexion : l'IA revient dès que tu as internet." };

  let last = null;

    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 40000);
    let r;

function muscleSVG(prim = [], sec = [], focus = [], mini = false, colors = null) {
  const cls = id => "m" + (prim.includes(id) ? " prim" : sec.includes(id) ? " sec" : "") + (focus.includes(id) ? " focus" : "");
  const shapes = (list, ox) => list.map(([id, cx, cy, rx, ry, rot, single]) => {
    const one = (x, r) => `<ellipse class="${cls(id)}" ${colors && colors[id] ? `style="fill:${colors[id]};opacity:.9"` : ""} cx="${ox + x}" cy="${cy}" rx="${rx}" ry="${ry}" transform="rotate(${r} ${ox + x} ${cy})"><title>${MUSCLES[id][0]}</title></ellipse>`;
    return single ? one(cx, rot) : one(cx, rot) + one(100 - cx, -rot);
  }).join("");
  const sil = ox => {
    const L = (x1, y1, x2, y2, w) => `<line class="sil" x1="${ox + x1}" y1="${y1}" x2="${ox + x2}" y2="${y2}" stroke-width="${w}"/><line class="sil" x1="${ox + 100 - x1}" y1="${y1}" x2="${ox + 100 - x2}" y2="${y2}" stroke-width="${w}"/>`;

    const msg = `Tendance : ${rate > 0 ? "+" : ""}${Math.round(rate * 100) / 100} % du poids par semaine. Repère pour « ${GOALS[p.goal].label} » : entre ${lo} et ${hi} %/sem.`;

  }

  if (hasW) {
    const low = VOLUME_GROUPS.filter(g => vol[g] > 0 && vol[g] < 8 && !["Avant-bras", "Lombaires", "Trapèzes", "Coiffe des rotateurs", "Adducteurs"].includes(g));
    if (low.length) R.push({ l: "warn", t: "Volume bas sur certains muscles", x: `${low.map(g => `${g} (${r1(vol[g])} séries)`).join(", ")}. Les études dose-réponse (Schoenfeld 2017) montrent plus d'hypertrophie vers 10-20 séries dures/semaine. Si un de ces muscles est une priorité, ajoute 2-4 séries par semaine.` });

  }
  const stal = [...new Set(workouts().flatMap(w => (w.ex || []).map(e => e.id)))].filter(stalled);
  if (stal.length) R.push({ l: "warn", t: "Stagnation détectée", x: `${stal.map(id => getEx(id).name).join(", ")} : pas de progrès du 1RM estimé sur les 3 dernières séances. Pistes : vérifie le sommeil et les protéines, change de variante, ou fais une semaine allégée (deload, −40 % de volume).` });

}

const fridgeDoc = () => Store.get("fridge", {});
const fridgeItems = () => (fridgeDoc().items || []).filter(i => i && i.qty > 0);
function saveFridgeItems(items) { const d = clone(fridgeDoc()) || {}; d.items = items; Store.set("fridge", d); }
const normN = s => (s || "").toLowerCase().replace(/œ/g, "oe").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\(.*?\)/g, "").trim();
const qtyTxt = it => it.unit === "pc" ? `${r1(it.qty)} pièce${it.qty > 1 ? "s" : ""}` : it.qty >= 1000 ? `${r1(it.qty / 1000)} kg` : `${r0(it.qty)} g`;
function fridgeFind(name) {
  const n = normN(name); if (!n) return null;
  const items = fridgeItems();
  const W = s => s.split(/[^a-z0-9]+/).filter(w => w.length > 2 && !["les", "des", "aux", "avec", "cuit", "cru", "crue", "cuite"].includes(w));
  const nw = W(n);
  return items.find(i => normN(i.name) === n) || items.find(i => { const mw = W(normN(i.name)); if (!mw.length || !nw.length) return false; const [a, b] = mw.length <= nw.length ? [mw, nw] : [nw, mw]; return a.every(w => b.some(x => x === w || x === w + "s" || w === x + "s")); }) || null;
}
// quand il mange quelque chose qui est dans le frigo, on le retire
function fridgeConsume(name, g) {
  const it = fridgeFind(name); if (!it || !(g > 0)) return null;
  const items = clone(fridgeDoc().items || []); const x = items.find(i => i.id === it.id);
  x.qty = x.unit === "pc" ? x.qty - g / (x.gPerPc || 100) : x.qty - g;
  if (x.qty <= 0.05) x.qty = 0;
  saveFridgeItems(items.filter(i => i.qty > 0));
  return x;
}
function fridgeAdd(list) {

    const ex = items.find(i => normN(i.name) === normN(n.name) && i.unit === n.unit && (i.zone || "frigo") === (n.zone || "frigo"));

  });
  saveFridgeItems(items);
}

function drvValue(d, kcal) { if (d[3] != null) return d[3]; const mj = (kcal || 2500) * 0.004184; return d[0] === "thiamin" ? r1(0.1 * mj) : r1(1.6 * mj); }
// ---- ajustement automatique de l'objectif chaque lundi (méthode « dépense adaptative ») ----
function weekKey(d = new Date()) { const t = new Date(d); t.setHours(0, 0, 0, 0); t.setDate(t.getDate() - ((t.getDay() + 6) % 7)); return dateKey(t); }
function weeklyAdjust(tdee, factor, ad) {
  const wk = weekKey(); const A = Store.get("adjust", {}) || {};
  if (A.week === wk && A.kcal) return A;
  const kcal = r0(tdee * (1 + factor));
  const N = { week: wk, kcal, tdee: r0(tdee), prev: A.kcal || null, slope: ad?.slopeWeek != null ? Math.round(ad.slopeWeek * 100) / 100 : null, hist: [...(A.hist || []), ...(A.kcal ? [[A.week, A.kcal]] : [])].slice(-12) };
  setTimeout(() => Store.set("adjust", N), 0); return N;
}

function muscleFatigue() {
  const now = Date.now(); const f = {}; Object.keys(MUSCLES).forEach(m => f[m] = 0);
  workouts().forEach(w => { const h = (now - (w.end || w.start)) / 3600000; if (h > 120 || w.live) return; const decay = Math.exp(-h / 30);
    (w.ex || []).forEach(e => { const n = workSets(e).length; if (!n) return; const x = getEx(e.id);
      x.prim.forEach(m => f[m] = (f[m] || 0) + n * decay); x.sec.forEach(m => f[m] = (f[m] || 0) + n * 0.5 * decay); }); });
  const rec = {}; Object.keys(f).forEach(m => rec[m] = Math.max(0, Math.min(1, 1 - f[m] / 6))); return rec; // 1 = récupéré
}

// Après chaque série validée : compte à rebours flottant (durée selon l'exercice, réglable et mémorisée),

const COMPOUND = new Set(["squat", "bench_press", "rdl", "leg_press", "hack_squat", "hip_thrust", "pull_up", "lat_pulldown_pron", "row_neutral_close", "row_pron_wide", "incline_press_machine", "chest_press", "db_incline_press", "shoulder_press", "dips", "bulgarian", "db_row"]);
const REST = { end: 0, total: 0, exId: null, iv: null };
function restDefault(exId) {
  try { const m = JSON.parse(localStorage.getItem("muscu_rest") || "{}"); if (m[exId]) return m[exId]; } catch (e) {}
  return COMPOUND.has(exId) ? 150 : 90;
}
function restSave(exId, sec) { try { const m = JSON.parse(localStorage.getItem("muscu_rest") || "{}"); m[exId] = sec; localStorage.setItem("muscu_rest", JSON.stringify(m)); } catch (e) {} }
function restStart(exId, warmup) {
  const sec = warmup ? 60 : restDefault(exId);
  REST.exId = exId; REST.total = sec; REST.end = Date.now() + sec * 1000; REST.done = false; restTick();
  clearInterval(REST.iv); REST.iv = setInterval(restTick, 250);
}
function restStop() { clearInterval(REST.iv); REST.iv = null; REST.end = 0; const el = document.getElementById("restBar"); if (el) el.remove(); }
function restBeep() {
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
  try { const A = window.AudioContext || window.webkitAudioContext; const ctx = REST.ctx || (REST.ctx = new A());
    [0, 0.25].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.18);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2); }); } catch (e) {}
}
function restTick() {
  if (!REST.end) return; let el = document.getElementById("restBar");
  if (!el) { el = document.createElement("div"); el.id = "restBar"; el.className = "restbar"; document.body.appendChild(el);
    el.addEventListener("click", e => { const b = e.target.closest("[data-r]"); if (!b) return; const k = b.dataset.r;
      if (k === "x") return restStop();
      const d = +k; REST.end += d * 1000; REST.total = Math.max(15, REST.total + d); if (REST.exId) restSave(REST.exId, Math.max(15, Math.round((restDefault(REST.exId) + d) / 15) * 15)); restTick(); }); }
  const left = Math.max(0, Math.round((REST.end - Date.now()) / 1000));
  if (left === 0 && !REST.done) { REST.done = true; restBeep(); setTimeout(restStop, 4000); }
  const pct = REST.total ? Math.min(100, 100 * (1 - left / REST.total)) : 100;
  el.classList.toggle("over", left === 0);
  el.innerHTML = `<div class="restfill" style="width:${pct}%"></div><div class="restin"><span>${left === 0 ? "C'est reparti 💪" : "Repos"}</span><b>${fmtDur(left * 1000)}</b>
    <button data-r="-15">−15 s</button><button data-r="15">+15 s</button><button data-r="x" aria-label="Fermer">✕</button></div>`;
}

}

//    calorimétrie indirecte, 22 hommes (83 kg, 180,5 cm) et 16 femmes. Le coût est une fonction linéaire du TRAVAIL :
//    travail = charge (kg) × distance verticale parcourue (m) × répétitions.
//      squat      : coût (kJ) = 14.931 + 0.0942 × travail   (r = 0.977)
//      soulevé    : coût (kJ) = 56.592 + 0.102  × travail   (r = 0.997)
//      dév. incliné: coût (kJ) = 3.21  + 0.0911 × travail   (r = 0.947)
//      shrug      : coût (kJ) = 0.0455 + 0.246  × travail   (r = 0.921)
//      mollets    : coût (kJ) = 1.945 + 0.296  × travail    (r = 0.941)

//  • Robergs et al. 2007, J Strength Cond Res 21(1):123-130 : la charge et la distance parcourue prédisent le coût
//    (le poids du corps n'entre pas dans leur équation, sauf quand c'est lui qu'on soulève).
// Modélisation (calculs, pas de nouvelles données) :
//  • chaque exercice est rattaché au mouvement mesuré le plus proche (même masse musculaire / même schéma) ;
//  • la distance de référence (pour 180,5 cm) est ajustée à ta taille ;
//  • quand le corps bouge avec la charge (squat, fentes, tractions, dips…), la partie du corps soulevée est
//    ajoutée à la charge (travail = masse du « système » × distance, méthode de McBride et al. 2009) ;
//  • 1 kcal = 4,184 kJ. Résultat = dépense NETTE due à la série (au-dessus du repos).
const EN_MODELS = {

  dips: { m: "press", d: 0.4, bw: 0.95 }, hammer_rope: { m: "isoUp", d: 0.4 }, bayesian_curl: { m: "isoUp", d: 0.45 }, incline_db_curl: { m: "isoUp", d: 0.45, k: 2 },
  preacher_curl: { m: "isoUp", d: 0.4 }, cable_crunch: { m: "isoUp", d: 0.35 }, incline_press_machine: { m: "press", d: 0.45 }, bench_press: { m: "press", d: 0.42 },
  db_incline_press: { m: "press", d: 0.45, k: 2 }, chest_press: { m: "press", d: 0.4 }, pec_fly_machine: { m: "isoUp", d: 0.4 },
  lat_pulldown_pron: { m: "press", d: 0.55 }, pull_up: { m: "press", d: 0.55, bw: 0.95 }, row_neutral_close: { m: "press", d: 0.4 }, row_pron_wide: { m: "press", d: 0.4 },
  db_row: { m: "press", d: 0.45 }, shrug: { m: "isoUp", d: 0.115 }, squat: { m: "squat", d: 0.55, bw: 0.88 }, leg_press: { m: "squat", d: 0.35 },
  hack_squat: { m: "squat", d: 0.4, bw: 0.88 }, leg_ext: { m: "isoLow", d: 0.3 }, bulgarian: { m: "squat", d: 0.4, bw: 0.88 }, lunges: { m: "squat", d: 0.4, bw: 0.88 },
  rdl: { m: "dead", d: 0.5 }, seated_leg_curl: { m: "isoLow", d: 0.3 }, lying_leg_curl: { m: "isoLow", d: 0.3 }, hip_thrust: { m: "squat", d: 0.25, bw: 0.4 },
  adductor_machine: { m: "isoLow", d: 0.25 }, abductor_machine: { m: "isoLow", d: 0.25 }, calf_standing: { m: "isoLow", d: 0.1, bw: 1 }, calf_seated: { m: "isoLow", d: 0.08 },

  Squat : coût = 14,9 kJ + 0,0942 × travail · Soulevé : 56,6 + 0,102 × travail · Développé : 3,2 + 0,0911 × travail · Shrug : 0,05 + 0,246 × travail · Mollets : 1,9 + 0,296 × travail.<br>

  <h3>Ce que je calcule pour toi</h3><ul class="sm">

function gymExIds() { const s = new Set(); GYM_MACHINES.forEach(m => m.ex.forEach(id => s.add(id))); Object.keys(customEx()).forEach(id => s.add(id)); return s; }

function exSimilarity(a, b) {
  const A = getEx(a), B = getEx(b); let s = 0;
  A.focus.forEach(m => { if (B.focus.includes(m)) s += 4; else if (B.prim.includes(m)) s += 2; });
  A.prim.forEach(m => { if (B.prim.includes(m)) s += 2; else if (B.sec.includes(m)) s += 0.5; });
  const gA = new Set(A.prim.map(m => MUSCLES[m]?.[1])); B.prim.forEach(m => { if (gA.has(MUSCLES[m]?.[1])) s += 1; });

}
function replacementsFor(exId, exclude = []) {
  const ok = gymExIds(), ban = banned(), ex = new Set([exId, ...exclude]);
  return allEx().filter(x => !ex.has(x.id) && !ban.has(x.id) && ok.has(x.id)).map(x => ({ id: x.id, s: exSimilarity(exId, x.id) })).filter(x => x.s >= 1).sort((p, q) => q.s - p.s).map(x => x.id);
}
// ---------- « Je ne veux pas faire cet exo » ----------
function refuseSheet(i, ctx = "live") {

    const inW = ctx === "live" ? (liveWorkout().ex || []).map(e => e.id) : S.gen.days[S.genDay].ex.map(e => e.id);

      <p class="sm mut">Je te propose des exercices de ta salle qui travaillent les mêmes muscles :</p>
      ${alts.map((id, k) => { const x = getEx(id); return `<div class="entry" data-act="refusePick" data-v="${id}" data-i="${i}" data-ctx="${ctx}"><div style="width:84px;flex:none">${bodyThumbHTML({ prim: x.prim, sec: x.sec, focus: x.focus })}</div><div class="grow"><div class="b">${esc(x.name)}${k === 0 ? ` <span class="pill">conseillé</span>` : ""}</div><div class="xs mut">${x.focus.map(m => MUSCLES[m][0]).join(", ")}</div></div><div class="mut">›</div></div>`; }).join("") || `<p class="sm">Aucun équivalent trouvé dans ta salle.</p>`}

}
function banEx(id) { const doc = clone(Store.get("program", {})); doc.banned = [...new Set([...(doc.banned || []), id])]; // retire aussi des modèles

// ---------- séance fantôme : comparaison série par série avec la dernière fois ----------
function ghostCmp(cur, prev) { if (!prev) return null; if (+cur.w === +prev.w) return Math.sign(cur.r - prev.r); const a = e1rm(cur), b = e1rm(prev); if (Math.abs(a - b) / b < 0.01) return 0; return a > b ? 1 : -1; }

// ---------- générateur de programme ----------
// volumes hebdo par muscle : 10-12 séries (entretien/progression) et 16-20 pour les muscles prioritaires
// (relation dose-réponse : Schoenfeld et al. 2017, J Sports Sci ; Pelland et al. 2024, méta-régression).
const SPLITS = {
  2: [["Full body A", "all"], ["Full body B", "all"]],
  3: [["Push (pecs, épaules, triceps)", "push"], ["Pull (dos, biceps)", "pull"], ["Jambes", "legs"]],
  4: [["Haut A", "upper"], ["Bas A", "legs"], ["Haut B", "upper"], ["Bas B", "legs"]],
  5: [["Push", "push"], ["Pull", "pull"], ["Jambes", "legs"], ["Haut", "upper"], ["Bas", "legs"]],
  6: [["Push A", "push"], ["Pull A", "pull"], ["Jambes A", "legs"], ["Push B", "push"], ["Pull B", "pull"], ["Jambes B", "legs"]]

const DAY_GROUPS = {
  push: ["Pectoraux", "Épaules avant", "Épaules latérales", "Triceps"], pull: ["Dos – largeur", "Dos – épaisseur", "Épaules arrière", "Biceps", "Avant-bras", "Trapèzes"],

    const groups = DAY_GROUPS[k].slice().sort((a, b) => (prio.has(b) ? 1 : 0) - (prio.has(a) ? 1 : 0));
    // séries visées pour chaque muscle ce jour-là, ramenées à ce qui tient dans la durée choisie
    // on vise le volume complet, puis on réduit tant que la séance ne tient pas dans la durée choisie
    const usedSnap = Object.assign({}, used); let ex;

        .sort((a, b) => ((used[a.id] || 0) - (used[b.id] || 0)) * 3 + (isCompound(b) - isCompound(a)) * 2 + ((o.keep || []).includes(b.id) - (o.keep || []).includes(a.id)));

  return new Promise((res, rej) => { const r = indexedDB.open("muscu_photos", 1); r.onupgradeneeded = () => r.result.createObjectStore("p", { keyPath: "id" }); r.onsuccess = () => { PH.db = r.result; res(PH.db); }; r.onerror = () => rej(r.error); });
}
async function phLoad() { const db = await phDB(); return new Promise(res => { const out = []; const c = db.transaction("p").objectStore("p").openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { out.push(cur.value); cur.continue(); } else { PH.list = out.sort((a, b) => b.date.localeCompare(a.date) || b.t - a.t); res(PH.list); } }; }); }
async function phAdd(blob, view, date) { const db = await phDB(); const it = { id: uid(), t: Date.now(), date: date || todayKey(), view, blob, w: r1(latestWeight()) }; await new Promise(r => { const tx = db.transaction("p", "readwrite"); tx.objectStore("p").put(it); tx.oncomplete = r; }); await phLoad(); return it; }
async function phDel(id) { const db = await phDB(); await new Promise(r => { const tx = db.transaction("p", "readwrite"); tx.objectStore("p").delete(id); tx.oncomplete = r; }); if (PH.urls[id]) { URL.revokeObjectURL(PH.urls[id]); delete PH.urls[id]; } await phLoad(); }
function phURL(it) { return PH.urls[it.id] || (PH.urls[it.id] = URL.createObjectURL(it.blob)); }

function poseSVG(k) {
  const head = `<circle cx="30" cy="11" r="7"/>`;
  const legs = `<path d="M24 52 L22 84 M36 52 L38 84"/>`;
  const torso = k === "profil" ? `<path d="M30 18 C35 26 35 44 30 52"/>` : `<path d="M22 20 L38 20 L36 52 L24 52 Z"/>`;
  const arms = { face: "M22 22 L18 50 M38 22 L42 50", profil: "M30 22 L32 50", dos: "M22 22 L18 50 M38 22 L42 50", fdb: "M22 22 L10 22 L10 8 M38 22 L50 22 L50 8", ddb: "M22 22 L10 22 L10 8 M38 22 L50 22 L50 8", abs: "M22 22 L16 10 L28 6 M38 22 L44 10 L32 6" }[k];
  const back = k === "dos" || k === "ddb" ? `<path d="M30 21 L30 50" stroke-dasharray="2 3"/>` : "";
  return `<svg viewBox="0 0 60 88" width="44" height="64" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="opacity:.55">${head}${torso}${back}<path d="${arms}"/>${legs}</svg>`;
}
const bilans = () => (Store.get("bilans", { items: [] }).items || []).slice().sort((a, b) => a.date.localeCompare(b.date));
function saveBilan(b) { const doc = clone(Store.get("bilans", { items: [] })); doc.items = (doc.items || []).filter(x => x.id !== b.id); doc.items.push(b); Store.set("bilans", doc); }
function weekAvgWeight(k) { const w = [0, 1, 2, 3, 4, 5, 6].map(i => day(addDays(k, -i)).weight).filter(Boolean); return w.length ? r1(w.reduce((s, x) => s + x, 0) / w.length) : null; }
function daysBetween(a, b) { return Math.round((parseKey(b) - parseKey(a)) / 864e5); }
function agoText(n) { // 9 → « il y a 1 semaine et 2 jours », 38 → « il y a 1 mois et 1 semaine »
  if (n <= 0) return "aujourd'hui"; if (n < 7) return `il y a ${n} jour${n > 1 ? "s" : ""}`;
  const parts = [];
  if (n < 30) { const w = Math.floor(n / 7), d = n % 7; parts.push(`${w} semaine${w > 1 ? "s" : ""}`); if (d) parts.push(`${d} jour${d > 1 ? "s" : ""}`); }
  else { const m = Math.floor(n / 30), w = Math.round((n - m * 30) / 7); parts.push(`${m} mois`); if (w) parts.push(`${w} semaine${w > 1 ? "s" : ""}`); }
  return "il y a " + parts.join(" et ");
}
// bilan de référence : le plus récent d'il y a au moins 5 jours (semaine), et le plus proche de 30 jours parmi ceux d'il y a au moins 21 jours (mois)
function refBilans(cur) {
  const prev = bilans().filter(b => b.id !== cur.id && b.date < cur.date);
  const week = prev.filter(b => daysBetween(b.date, cur.date) >= 5).pop() || null;
  const monthC = prev.filter(b => daysBetween(b.date, cur.date) >= 21 && b !== week);
  const month = monthC.sort((a, b) => Math.abs(daysBetween(a.date, cur.date) - 30) - Math.abs(daysBetween(b.date, cur.date) - 30))[0] || null;
  return { week, month };
}
function bilanDue() { const l = bilans().pop(); return !l || daysBetween(l.date, todayKey()) >= 7; }
function photoOf(b, pose) { const id = b?.photos?.[pose]; return id ? PH.list.find(p => p.id === id) : null; }

function cmpBlock(cur, ref, label) {

  const goal = profile().goal; const lossGood = goal === "cut" || goal === "recomp";
  const mRows = MEASURES.filter(([k]) => cur.m?.[k] && ref.m?.[k]).map(([k, l]) => { const d = r1(cur.m[k] - ref.m[k]); const good = k === "taille" ? d <= 0 : d >= 0; return `<span class="tag ${d === 0 ? "" : good ? "grn" : "red"}">${l} ${d > 0 ? "+" : ""}${d} cm</span>`; }).join(" ");
  return `<div class="card"><div class="row between"><h3 style="margin:0">${label}</h3><span class="xs mut">${agoText(n)}</span></div>
    <div class="xs mut">${fmtDay(ref.date)} → ${fmtDay(cur.date)}${dW !== null ? ` · poids <b style="color:var(--${(lossGood ? dW <= 0 : dW >= 0) ? "ok,#16a34a" : "txt"})">${dW > 0 ? "+" : ""}${dW} kg</b> (${ref.weight} → ${cur.weight} kg)` : ""}</div>

  exportData: async () => { try { await navigator.clipboard.writeText(JSON.stringify(Store.docs)); toast("Sauvegarde copiée : colle-la dans une note"); } catch (e) { toast("Copie refusée par le navigateur"); } },
  importData: () => openSheet(() => `<h2>Restaurer une sauvegarde</h2><p class="sm mut">Colle le texte copié avec « Copier une sauvegarde ». Les documents existants avec le même nom seront remplacés.</p><textarea id="impTxt"></textarea><div class="row" style="margin-top:8px"><button class="sec grow" data-act="closeSheet">Annuler</button><button class="grow" data-act="importGo">Restaurer</button></div>`),
  importGo: () => { try { const o = JSON.parse($("#impTxt").value); Object.entries(o).forEach(([k, v]) => { if (v && typeof v === "object") Store.set(k, v); }); toast("Restauré"); closeSheet(); } catch (e) { toast("Texte invalide"); } },
};

// ----- code-barres
let _zx = null;
function loadZXing() { if (_zx) return _zx; _zx = new Promise(res => { const s = document.createElement("script"); s.src = "vendor/zxing.min.js"; s.onload = () => res(window.ZXing || null); s.onerror = () => res(null); document.head.appendChild(s); setTimeout(() => res(window.ZXing || null), 8000); }); return _zx; }
async function decodeBarcode(file) {
  try { const Z = await loadZXing(); if (!Z) return null; const url = URL.createObjectURL(file);
    const hints = new Map(); hints.set(Z.DecodeHintType.TRY_HARDER, true);
    const reader = new Z.BrowserMultiFormatReader(hints); const r = await reader.decodeFromImageUrl(url); return r?.getText?.() || r?.text || null; } catch (e) { return null; }
}
async function handleBarcode(code) {
  const f = myFoods()["bc" + code];
  if (f) { S.add.sel = f; S.add.g = f.unit || 100; S.add.busy = false; renderSheet(); return; }
  S.add.busy = true; renderSheet();
  const off = await offBarcode(code);
  if (off) { const saved = saveMyFood(off); toast("Produit trouvé : " + off.name); S.add.sel = saved; S.add.g = saved.unit || 100; S.add.busy = false; renderSheet(); return; }
  S.add.scan = { step: "label", barcode: code }; S.add.busy = false; renderSheet();
}
async function onFile(kind, file) {
  if (!file) return; S.add.err = "";
  if (kind === "shop") { S.shop.busy = true; S.shop.err = ""; renderSheet(); try { const b = await shrinkImage(file, 1600); const r = await aiShop("", b); S.shop.items = (r?.items || []).filter(x => x && x.name && x.qty > 0); if (!S.shop.items.length) S.shop.err = "Rien reconnu sur la photo."; } catch (e) { S.shop.err = aiErr(e); } S.shop.busy = false; renderSheet(); return; }
  if (kind === "physique") { try { const b = await shrinkImage(file, 1400); await phAdd(b, S.phView || "face"); toast("Photo ajoutée 📸"); } catch (e) { toast("Impossible d'enregistrer la photo"); } render(); return; }
  if (kind === "photo") { S.add.blob = await shrinkImage(file); S.add.img = URL.createObjectURL(S.add.blob); renderSheet(); return; }
  if (kind === "barcode") {
    S.add.busy = true; renderSheet();
    let code = await decodeBarcode(file);
    if (!code) { try { const small = await shrinkImage(file, 1600); const r = await aiBarcodeDigits(small); code = (r?.barcode || "").replace(/\D/g, ""); } catch (e) { S.add.err = aiErr(e); } }
    if (!code) { S.add.busy = false; S.add.err = S.add.err || "Code illisible : reprends la photo plus près, ou tape le code."; renderSheet(); return; }
    handleBarcode(code); return;
  }
  if (kind === "label") {
    S.add.busy = true; renderSheet();
    try { const blob = await shrinkImage(file, 1600); const r = await aiLabel(blob);
      const per100 = Object.fromEntries(NUTR_KEYS.map(k => [k, r?.per100?.[k] == null ? 0 : +r.per100[k]]));
      if (!per100.kcal && !per100.p && !per100.c) throw { message: "étiquette illisible, reprends la photo bien à plat" };
      const code = S.add.scan?.barcode || (r.barcode || "").replace(/\D/g, "") || null;
      const food = saveMyFood({ name: r.name || "Produit scanné", brand: r.brand || "", barcode: code, per100, unit: r.servingG || null });
      toast("Produit enregistré dans tes aliments"); S.add.sel = food; S.add.g = food.unit || 100; S.add.scan = null;
    } catch (e) { S.add.err = e?.code ? aiErr(e) : "Erreur : " + (e?.message || ""); }
    S.add.busy = false; renderSheet();
  }
}

async function onProductPhotos(files) {
  if (!files.length) return; S.add.busy = true; S.add.err = ""; renderSheet();
  try {
    const blobs = []; for (const f of files) blobs.push(await shrinkImage(f, 1600));
    const r = await aiProductPhotos(blobs);
    const per100 = Object.fromEntries(NUTR_KEYS.map(k => [k, r?.per100?.[k] == null ? 0 : +r.per100[k]]));
    if (!per100.kcal && !per100.p && !per100.c) throw { message: "valeurs illisibles, reprends la photo bien à plat et nette" };
    const code = S.add.scan?.barcode || (r.barcode || "").replace(/\D/g, "") || null;
    const food = saveMyFood({ name: (r.name || "Produit") + (r.estime ? " (estimé)" : ""), brand: r.brand || "", barcode: code, per100, unit: r.servingG || null });
    toast(r.estime ? "Produit reconnu (valeurs estimées)" : "Étiquette lue et enregistrée"); S.add.sel = food; S.add.g = food.unit || 100; S.add.scan = null;
  } catch (e) { S.add.err = e?.code ? aiErr(e) : "Erreur : " + (e?.message || ""); }
  S.add.busy = false; renderSheet();
}
async function onFridgePhotos(files) {
  if (!files.length) return; toast("Lecture du produit…");
  try { const blobs = []; for (const f of files) blobs.push(await shrinkImage(f, 1600)); const r = await aiProductPhotos(blobs);
    const per100 = Object.fromEntries(NUTR_KEYS.map(k => [k, r?.per100?.[k] == null ? 0 : +r.per100[k]]));
    const f = saveMyFood({ name: r.name || "Produit", brand: r.brand || "", barcode: (r.barcode || "").replace(/\D/g, "") || null, per100, unit: r.servingG || null });
    S._fpick = f; openSheet(fridgeQtySheet(f)); } catch (e) { toast(e?.code ? aiErr(e) : "Erreur de lecture"); }
}
// ===================== ÉVÉNEMENTS =====================
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act; if (el.tagName === "SELECT" || (el.tagName === "INPUT" && el.type === "checkbox")) return;
  if (ACT[a]) { if (a !== "closeSheetBg") ev.preventDefault(); ACT[a](el, ev); }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset.file === "hubphoto" || el.dataset.file === "hubprod") { const files = [...(el.files || [])]; Scanner.close(); resetAdd(defaultMeal());
    if (el.dataset.file === "hubphoto") { S.add.tab = "photo"; openSheet(addSheet); (async () => { if (!files[0]) return; S.add.blob = await shrinkImage(files[0]); S.add.img = URL.createObjectURL(S.add.blob); renderSheet(); ACT.aiPhoto(); })(); }
    else { S.add.tab = "scan"; openSheet(addSheet); onProductPhotos(files.slice(0, 3)); }
    el.value = ""; return; }
  if (el.dataset.file === "pose") { onPoseFile(el.dataset.v, el.files?.[0]); el.value = ""; return; }
  if (el.dataset.file) { if (el.dataset.file === "prodphotos") onProductPhotos([...(el.files || [])].slice(0, 3)); else if (el.dataset.file === "fridgephotos") onFridgePhotos([...(el.files || [])].slice(0, 3)); else onFile(el.dataset.file, el.files?.[0]); el.value = ""; return; }
  if (el.dataset.act === "range") { const [a, b] = el.value.split("-").map(Number); const doc = clone(Store.get("program", {})); doc.ranges = doc.ranges || {}; doc.ranges[el.dataset.v] = [a, b]; Store.set("program", doc); return; }
  if (el.dataset.act === "progEx") { S.progEx = el.value; render(); return; }
  if (el.dataset.act === "moodTrack") { const pr = clone(Store.get("profile", {})); pr.moodTrack = el.checked; Store.set("profile", pr); renderSheet(); return; }
  if (el.dataset.act === "gymGoto") { if (el.value) gymGoto(el.value); el.value = ""; return; }
  if (el.dataset.act === "copyChk") { S.copySel[+el.dataset.v] = el.checked; renderSheet(); return; }
  if (el.dataset.act === "dayPick" && el.value) { S.day = el.value > maxPlanDay() ? maxPlanDay() : el.value; render(); return; }
  if (el.id === "copyDate" && el.value) { S.copyFrom = el.value; S.copySel = null; renderSheet(); return; }
  if (el.id === "wDate") { const w = liveWorkout(); if (w && el.value) { const t = new Date(w.start); const d = parseKey(el.value); d.setHours(t.getHours(), t.getMinutes()); const delta = d.getTime() - w.start; updW(o => { o.start += delta; o.ex.forEach(e => e.sets.forEach(s => s.t += delta)); }); } return; }
  if (el.dataset.act === "warmAll") { updW(w => w.warmDone = el.checked); return; }
  if (el.type === "checkbox" && el.dataset.act && ACT[el.dataset.act]) ACT[el.dataset.act](el, ev);
});
document.addEventListener("input", ev => {
  const el = ev.target; const k = el.dataset.input; if (!k) return;
  if (k === "q") { S.add.q = el.value; S.add.offRes = null; _searchRes = searchFoods(el.value); $("#qres").innerHTML = foodList(_searchRes); }
  else if (k === "g") { S.add.g = +el.value; const f = S.add.sel, n = scaleNutr(f.per100, +el.value || 0); $("#selN").innerHTML = `<b>${r0(n.kcal)} kcal</b> · P ${r1(n.p)} g · G ${r1(n.c)} g · L ${r1(n.f)} g`; }
  else if (k === "itemG") { S.add.items[+el.dataset.i].grams = +el.value || 0; }
  else if (k === "fq") { S.fq = el.value; const res = searchFoods(el.value).slice(0, 12); S._fres = res; $("#fres").innerHTML = fridgeResHTML(res, el.value); }
  else if (k === "shopQ") { S.shop.items[+el.dataset.i].qty = +el.value || 0; }
  else if (k === "recQ") { S.rec.q = el.value; const res = searchFoods(el.value).slice(0, 8); S._recRes = res; $("#recRes").innerHTML = res.map((f, i) => `<div class="entry" data-act="recAddIng" data-i="${i}"><span class="sm">${esc(f.name)}</span><span class="mut">+</span></div>`).join(""); }
  else if (k === "recG") { S.rec.ings[+el.dataset.i].g = +el.value || 0; }
  else if (k === "recP") { S.recPortions = parseFloat(el.value) || 1; }
  else if (k === "phSplit") { S.phSplit = +el.value; const t = $("#phTop"), l = $("#phLine"); if (t) t.style.clipPath = `inset(0 0 0 ${el.value}%)`; if (l) l.style.left = el.value + "%"; }
  else if (k === "draft") { const dr = S.draft[+el.dataset.i]; if (dr) dr[el.dataset.k] = el.value; }
  else if (k === "exQ") { S.exQ = el.value; const sh = exPickerSheet("add")(); const tmp = document.createElement("div"); tmp.innerHTML = sh; $("#exList").innerHTML = tmp.querySelector("#exList").innerHTML; }
});
// recalcul de la liste de recherche quand la feuille s'affiche
const _origRenderSheet = renderSheet;
renderSheet = function () { if (S.sheet === addSheet && !S.add.sel && !S.add.items && S.add.tab === "search") _searchRes = S.add.offRes || searchFoods(S.add.q); _origRenderSheet(); };

Object.assign(ACT, PLATFORM_ACT, RECIPE_ACT, BODY_ACT, PROG_ACT, NUT_ACT, PH_ACT, BL_ACT);
ACT_PICK_MACHINE = id => openSheet(machineSheet(id));
ACT_PICK_FRIDGE = id => openSheet(fridgeItemSheet(id));
Store.on(() => { render(); if (liveWorkout()) scheduleTimer(); wakeSync(); });
if (typeof IS_SP_REDIRECT === "undefined" || !IS_SP_REDIRECT) { render(); Store.init(); if (typeof spBoot === "function") spBoot(); }

</script></body></html>
