<title>Muscu & Nutrition</title>
<style>:root{--bg:#f3f5fa;--card:#ffffff;--txt:#111827;--mut:#6b7280;--line:#e8ebf2;--acc:#2563eb;--acc2:#e6eeff;--red:#e5484d;--org:#f59e0b;--grn:#16a34a;--p:#2563eb;--c:#f59e0b;--f:#a855f7;--chip:#eef1f7;--shadow:0 1px 2px rgba(17,24,39,.04),0 4px 14px rgba(17,24,39,.06);--grad:linear-gradient(135deg,#2563eb,#4f46e5)}
html.dark{--bg:#14161b;--card:#1d2027;--txt:#eef0f3;--mut:#a0a7b4;--line:#2a2e37;--acc:#5b8cff;--acc2:#1e2a45;--chip:#272b34;--shadow:none;--grad:linear-gradient(135deg,#3b82f6,#6366f1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif}
#app{max-width:720px;margin:0 auto;padding:12px 12px 90px}
h1{font-size:22px;margin:4px 0 10px}h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:600}.c{text-align:center}
button,.btn{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--chip);color:var(--txt)}button.ghost{background:transparent;color:var(--acc);padding:6px 8px}
button.danger{background:transparent;color:var(--red)}button:disabled{opacity:.5}
button.small{padding:6px 10px;font-size:13px;border-radius:10px}
input,select,textarea{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
input[type=number]{-moz-appearance:textfield}textarea{min-height:80px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}

/* =====================================================================
   DESIGN SYSTEM 2 (section Design) — APERÇU, NON PUBLIÉ
   Actif SEULEMENT quand <html data-ds> est présent (page dev/apercu-design.html).
   Sans cet attribut, l'app reste exactement comme aujourd'hui.
   Documentation : docs/design-system.md
   Couches : 1 primitives → 2 rôles par univers → 3 jetons sémantiques
             → 4 modes / styles → 5 composants.
   Couches 1-2 et 5 : sélecteurs :where() (priorité nulle, l'ordre suffit).
   Couches 3-4 : sélecteurs html[data-ds] (doivent battre :root et html.dark de style.css).
   ===================================================================== */

/* ---------- 1. PRIMITIVES (palettes d'origine, ne pas modifier) ---------- */
:where(html[data-ds]){
  /* Nutrition — Deep Ocean (validée) */
  --ocean-900:#103B49;--ocean-600:#208A91;--ocean-200:#BBD9DD;--ocean-50:#EDF4F5;--ocean-ink:#172B36;
  /* Cuisine — Warm Earth (validée) */
  --earth-900:#81543D;--earth-600:#B77C55;--earth-400:#D4AB86;--earth-200:#EBD6C1;--earth-50:#F6EFE6;
  /* Progression — Slate Blue (validée) */
  --slate-900:#303E5C;--slate-600:#526889;--slate-400:#8296B5;--slate-200:#C6D2E4;--slate-50:#EDF0F6;
  /* Musculation — 5 finalistes (en attente du choix de Vuthy) */
  --cherry-900:#361923;--cherry-600:#702D44;--cherry-400:#A65C75;--cherry-200:#DFC0CE;--cherry-50:#F6EAF0;
  --ruby-900:#50182D;--ruby-600:#A12C53;--ruby-400:#D36D90;--ruby-200:#F1C9D8;--ruby-50:#FCEFF4;
  --pome-900:#58232D;--pome-600:#B34559;--pome-400:#DD8998;--pome-200:#F1CED5;--pome-50:#FBEFF1;
  --graph-900:#181818;--graph-600:#383838;--graph-400:#737373;--graph-200:#C7C7C7;--graph-50:#F0F0F0;
  --carbon-900:#20211D;--carbon-600:#494B39;--carbon-400:#C7BA49;--carbon-200:#E9DB76;--carbon-50:#F7F5E5;
  /* Neutres (communs à tous les univers) */
  --n-0:#FFFFFF;--n-50:#F6F6F7;--n-100:#EEEFF1;--n-200:#E2E4E8;--n-500:#5F6670;--n-800:#2A2F37;--n-900:#16181D;
  --d-bg:#0F1114;--d-card:#181B20;--d-raise:#20242A;--d-chip:#262A31;--d-line:#2C313A;--d-txt:#ECEEF1;--d-mut:#9AA1AC;

  /* ---------- Couleurs fonctionnelles (indépendantes des univers) ---------- */
  --fn-ok:#2E7D4F;--fn-err:#C8372D;--fn-warn:#9A5B00;--fn-warn-fill:#E9A23B;--fn-info:#2F5FB3;
  --fn-record:#A0710A;              /* toujours avec 🏆 ou « record » */
  --fn-up:var(--fn-ok);--fn-down:var(--n-500); /* baisse = gris neutre, jamais rouge (règle 3) */
  --mac-p:#4F6BED;--mac-c:#B87512;--mac-f:#9B6BDF;--mac-fib:#3F8A5D;
  --musc-prim:#C8553D;--musc-sec:#E3A15A;
  --rec-ok:#3F9C6B;--rec-near:#C9A227;--rec-mid:#E08A3C;--rec-low:#C8553D;

  /* ---------- Typographie, espaces, arrondis, mouvement ---------- */
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;
  --fs-xs:12px;--fs-sm:13px;--fs-md:16px;--fs-lg:17px;--fs-xl:22px;--fs-2xl:28px;
  --fw-reg:400;--fw-med:500;--fw-semi:600;--fw-bold:700;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;
  --r-sm:10px;--r-md:14px;--r-lg:20px;--r-pill:999px;
  --dur-fast:120ms;--dur:200ms;--ease:cubic-bezier(.2,.8,.2,1);
  --elev-1:0 1px 2px rgba(16,24,40,.04),0 2px 10px rgba(16,24,40,.05);

/* ---------- 2. RÔLES PAR UNIVERS (valeurs fixes, définies une fois) ----------
   deep = actions importantes · accent = texte/icônes accentués (≥ 4,5:1)
   mid = graphiques · soft/pastel = surfaces douces · wash = fond teinté
   *-dk = adaptations au mode sombre (nuances dérivées, documentées) */
:where(html[data-ds]){
  --nut-deep:var(--ocean-900);--nut-accent:#1A6F75;--nut-mid:var(--ocean-600);--nut-soft:#6EB2B7;--nut-pastel:var(--ocean-200);--nut-wash:var(--ocean-50);--nut-on:#fff;
  --nut-accent-dk:#6EB2B7;--nut-action-dk:var(--ocean-200);--nut-on-dk:var(--ocean-900);--nut-tint-dk:var(--ocean-ink);
  --cui-deep:var(--earth-900);--cui-accent:var(--earth-900);--cui-mid:var(--earth-600);--cui-soft:var(--earth-400);--cui-pastel:var(--earth-200);--cui-wash:var(--earth-50);--cui-on:#fff;

  --pro-accent-dk:var(--slate-400);--pro-action-dk:var(--slate-200);--pro-on-dk:var(--slate-900);--pro-tint-dk:#1B2233;
  /* Commun : 3 propositions (attribut data-ds-commun) — « neutre » par défaut */
  --com-deep:#1F2329;--com-accent:#1F2329;--com-mid:#4A515C;--com-soft:#8A919C;--com-pastel:#DADDE2;--com-wash:#F3F4F6;--com-on:#fff;
  --com-accent-dk:#E6E8EB;--com-action-dk:#E6E8EB;--com-on-dk:#15181C;--com-tint-dk:#16191E;
}
:where(html[data-ds][data-ds-commun=petrole]){
  --com-deep:var(--ocean-900);--com-accent:var(--ocean-900);--com-mid:var(--ocean-600);--com-soft:#6EB2B7;--com-pastel:var(--ocean-200);--com-wash:#F1F5F6;--com-on:#fff;
  --com-accent-dk:#6EB2B7;--com-action-dk:var(--ocean-200);--com-on-dk:var(--ocean-900);--com-tint-dk:var(--ocean-ink);
}
/* Musculation : la palette choisie remplit les rôles --mus-* (data-ds-muscu) */
:where(html[data-ds]),:where(html[data-ds][data-ds-muscu=cherry]){ /* Black Cherry = choix de Vuthy (26/11) */
  --mus-deep:var(--cherry-600);--mus-accent:var(--cherry-600);--mus-mid:var(--cherry-600);--mus-soft:var(--cherry-400);--mus-pastel:var(--cherry-200);--mus-wash:var(--cherry-50);--mus-on:#fff;--mus-hero:var(--cherry-900);
  --mus-accent-dk:var(--cherry-200);--mus-action-dk:var(--cherry-200);--mus-on-dk:var(--cherry-900);--mus-tint-dk:#1F1216;

  --mus-deep:var(--ruby-600);--mus-accent:var(--ruby-600);--mus-mid:var(--ruby-600);--mus-soft:var(--ruby-400);--mus-pastel:var(--ruby-200);--mus-wash:var(--ruby-50);--mus-on:#fff;--mus-hero:var(--ruby-900);

  --mus-accent-dk:var(--pome-400);--mus-action-dk:var(--pome-200);--mus-on-dk:var(--pome-900);--mus-tint-dk:#251417;
}
:where(html[data-ds][data-ds-muscu=graphite]){

  --mus-accent-dk:var(--carbon-400);--mus-action-dk:var(--carbon-200);--mus-on-dk:var(--carbon-900);--mus-tint-dk:#191A16;
}

/* L'univers d'un élément (data-u) recopie ses rôles dans --u-* (commun d'abord = valeur par défaut) */
:where(html[data-ds]),:where(html[data-ds][data-u=commun]),:where(html[data-ds]) :where([data-u=commun]){--u-deep:var(--com-deep);--u-accent:var(--com-accent);--u-mid:var(--com-mid);--u-soft:var(--com-soft);--u-pastel:var(--com-pastel);--u-wash:var(--com-wash);--u-on:var(--com-on);--u-hero:var(--com-deep);--u-accent-dk:var(--com-accent-dk);--u-action-dk:var(--com-action-dk);--u-on-dk:var(--com-on-dk);--u-tint-dk:var(--com-tint-dk)}
:where(html[data-ds][data-u=nutrition]),:where(html[data-ds]) :where([data-u=nutrition]){--u-deep:var(--nut-deep);--u-accent:var(--nut-accent);--u-mid:var(--nut-mid);--u-soft:var(--nut-soft);--u-pastel:var(--nut-pastel);--u-wash:var(--nut-wash);--u-on:var(--nut-on);--u-hero:var(--nut-deep);--u-accent-dk:var(--nut-accent-dk);--u-action-dk:var(--nut-action-dk);--u-on-dk:var(--nut-on-dk);--u-tint-dk:var(--nut-tint-dk)}

:where(html[data-ds][data-u=muscu]),:where(html[data-ds]) :where([data-u=muscu]){--u-deep:var(--mus-deep);--u-accent:var(--mus-accent);--u-mid:var(--mus-mid);--u-soft:var(--mus-soft);--u-pastel:var(--mus-pastel);--u-wash:var(--mus-wash);--u-on:var(--mus-on);--u-hero:var(--mus-hero);--u-accent-dk:var(--mus-accent-dk);--u-action-dk:var(--mus-action-dk);--u-on-dk:var(--mus-on-dk);--u-tint-dk:var(--mus-tint-dk)}
:where(html[data-ds][data-u=progression]),:where(html[data-ds]) :where([data-u=progression]){--u-deep:var(--pro-deep);--u-accent:var(--pro-accent);--u-mid:var(--pro-mid);--u-soft:var(--pro-soft);--u-pastel:var(--pro-pastel);--u-wash:var(--pro-wash);--u-on:var(--pro-on);--u-hero:var(--pro-deep);--u-accent-dk:var(--pro-accent-dk);--u-action-dk:var(--pro-action-dk);--u-on-dk:var(--pro-on-dk);--u-tint-dk:var(--pro-tint-dk)}

/* ---------- 3. JETONS SÉMANTIQUES (re-calculés là où l'univers change) ----------
   Les anciens noms (--bg, --card, --acc…) sont conservés : tous les composants
   existants suivent automatiquement, sans toucher au code des domaines. */
html[data-ds],html[data-ds] [data-u]{
  --surface-page:color-mix(in srgb,var(--u-wash) 60%,var(--n-50));
  --surface-card:var(--n-0);
  --surface-soft:color-mix(in srgb,var(--u-pastel) 30%,var(--n-0));
  --surface-sunken:color-mix(in srgb,var(--u-pastel) 28%,var(--n-100));
  --text-1:var(--n-900);--text-2:var(--n-500);
  --border:color-mix(in srgb,var(--u-pastel) 35%,var(--n-200));
  --separator:color-mix(in srgb,var(--u-pastel) 25%,var(--n-100));
  --action:var(--u-deep);--on-action:var(--u-on);
  --action-soft:color-mix(in srgb,var(--u-pastel) 40%,var(--n-0));--on-action-soft:var(--u-accent);
  --title:color-mix(in srgb,var(--u-accent) 80%,var(--n-900));
  --accent:var(--u-accent);--chart-1:var(--u-mid);--chart-2:var(--u-soft);--chart-3:var(--u-pastel);
  --focus:var(--u-accent);
  /* alias des anciens noms */
  --bg:var(--surface-page);--card:var(--surface-card);--txt:var(--text-1);--mut:var(--text-2);--line:var(--border);
  --chip:var(--surface-sunken);--acc:var(--accent);--acc2:var(--action-soft);--grad:var(--action);--kc:var(--u-mid);
  --red:var(--fn-err);--org:var(--fn-warn-fill);--grn:var(--fn-ok);--ok:var(--fn-ok);--p:var(--mac-p);--c:var(--mac-c);--f:var(--mac-f);
  --shadow:var(--elev-1);
}
/* Mode sombre : un fond commun, des surfaces légèrement différenciées, accents éclaircis */
html[data-ds].dark,html[data-ds].dark [data-u]{
  --surface-page:var(--d-bg);--surface-card:var(--d-card);
  --surface-soft:color-mix(in srgb,var(--u-tint-dk) 60%,var(--d-card));
  --surface-sunken:var(--d-chip);
  --text-1:var(--d-txt);--text-2:var(--d-mut);
  --border:var(--d-line);--separator:var(--d-line);
  --action:var(--u-action-dk);--on-action:var(--u-on-dk);
  --action-soft:color-mix(in srgb,var(--u-accent-dk) 16%,var(--d-card));--on-action-soft:var(--u-accent-dk);
  --title:var(--u-accent-dk);--accent:var(--u-accent-dk);--chart-1:var(--u-accent-dk);--chart-2:color-mix(in srgb,var(--u-accent-dk) 60%,var(--d-card));--chart-3:color-mix(in srgb,var(--u-accent-dk) 30%,var(--d-card));
  --kc:var(--u-accent-dk);
}

/* ---------- 4. TROIS NIVEAUX D'INTENSITÉ (data-ds-style = a | b | c) ---------- */
/* B — Immersif : fonds plus teintés, cartes secondaires colorées */
html[data-ds][data-ds-style=b],html[data-ds][data-ds-style=b] [data-u]{
  --surface-page:color-mix(in srgb,var(--u-pastel) 30%,var(--u-wash));
  --surface-card:color-mix(in srgb,var(--u-pastel) 14%,var(--n-0));
  --surface-sunken:color-mix(in srgb,var(--u-pastel) 55%,var(--n-0));
  --border:color-mix(in srgb,var(--u-pastel) 60%,var(--n-0));
}
html[data-ds][data-ds-style=b].dark,html[data-ds][data-ds-style=b].dark [data-u]{
  --surface-page:color-mix(in srgb,var(--u-tint-dk) 70%,var(--d-bg));
  --surface-card:color-mix(in srgb,var(--u-tint-dk) 55%,var(--d-card));
  --surface-sunken:color-mix(in srgb,var(--u-tint-dk) 40%,var(--d-chip));
  --border:color-mix(in srgb,var(--u-tint-dk) 40%,var(--d-line));
}
/* C — Premium contrasté : fond doux, carte principale profonde */
html[data-ds][data-ds-style=c],html[data-ds][data-ds-style=c] [data-u]{
  /* couleurs affirmées (maquette de Vuthy, 26/11) : fond bien teinté, cartes teintées,
     carte principale profonde, boutons secondaires pastel pleins à texte profond */
  --surface-page:color-mix(in srgb,var(--u-pastel) 30%,var(--u-wash));
  --surface-card:color-mix(in srgb,var(--u-wash) 70%,var(--n-0));
  --surface-soft:color-mix(in srgb,var(--u-pastel) 45%,var(--n-0));
  --surface-sunken:color-mix(in srgb,var(--u-pastel) 60%,var(--n-0));
  --border:color-mix(in srgb,var(--u-pastel) 70%,var(--n-0));
  --action-soft:var(--u-pastel);--on-action-soft:var(--u-hero);
  --title:var(--u-hero);
}
html[data-ds][data-ds-style=c].dark,html[data-ds][data-ds-style=c].dark [data-u]{
  --surface-page:color-mix(in srgb,var(--u-tint-dk) 45%,var(--d-bg));
  --surface-card:color-mix(in srgb,var(--u-tint-dk) 35%,var(--d-card));
  --surface-soft:color-mix(in srgb,var(--u-accent-dk) 14%,var(--d-card));
  --surface-sunken:color-mix(in srgb,var(--u-tint-dk) 50%,var(--d-chip));
  --border:color-mix(in srgb,var(--u-tint-dk) 50%,var(--d-line));
  --action-soft:color-mix(in srgb,var(--u-accent-dk) 22%,var(--d-card));--on-action-soft:var(--u-accent-dk);
  --title:var(--u-accent-dk);
}
/* La carte principale (.ds-hero, posée par theme.js) devient profonde en style C */
html[data-ds][data-ds-style=c] .ds-hero{
  --surface-card:var(--u-hero);--card:var(--u-hero);
  --txt:#fff;--mut:color-mix(in srgb,#fff 84%,var(--u-hero));
  --chip:color-mix(in srgb,#fff 14%,var(--u-hero));--line:color-mix(in srgb,#fff 16%,var(--u-hero));
  --acc:var(--u-pastel);--acc2:color-mix(in srgb,#fff 14%,var(--u-hero));--on-action-soft:#fff;--grad:var(--u-pastel);--on-action:var(--u-hero);
  --surface-soft:color-mix(in srgb,#fff 12%,var(--u-hero));--kc:var(--u-pastel);--p:#AFC0FF;--c:#F4C77A;--f:#D4BDF7;
  background:var(--u-hero)!important;color:#fff;box-shadow:0 6px 20px color-mix(in srgb,var(--u-hero) 28%,transparent);
}
html[data-ds][data-ds-style=c].dark .ds-hero{
  --u-hero-dk:color-mix(in srgb,var(--u-accent-dk) 22%,var(--d-card));
  --card:var(--u-hero-dk);--txt:var(--d-txt);--mut:#B9BFC8;--chip:color-mix(in srgb,#fff 10%,var(--u-hero-dk));--line:color-mix(in srgb,#fff 12%,var(--u-hero-dk));
  --surface-soft:color-mix(in srgb,#fff 8%,var(--u-hero-dk));--acc:var(--u-accent-dk);--acc2:color-mix(in srgb,#fff 10%,var(--u-hero-dk));--on-action-soft:var(--d-txt);--grad:var(--u-action-dk);--on-action:var(--u-on-dk);--kc:var(--u-accent-dk);
  --p:var(--mac-p);--c:var(--mac-c);--f:var(--mac-f);
  background:var(--u-hero-dk)!important;color:var(--d-txt);
}

/* ---------- 5. COMPOSANTS (mêmes classes que l'app ; aucune couleur en dur) ---------- */
:where(html[data-ds]) body{font-family:var(--font);background:var(--bg);color:var(--txt);transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease)}
:where(html[data-ds]) h1{font-size:var(--fs-2xl);font-weight:var(--fw-bold);letter-spacing:-.02em}
:where(html[data-ds][data-ds-style=b]) h1,:where(html[data-ds][data-ds-style=c]) h1{color:var(--title)}
:where(html[data-ds]) .card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);transition:background-color var(--dur) var(--ease)}
:where(html[data-ds].dark) .card{border:1px solid var(--line)}
/* boutons : principal = action profonde, texte lisible garanti */
:where(html[data-ds]) button,:where(html[data-ds]) .btn{background:var(--grad);color:var(--on-action);border-radius:var(--r-md);transition:transform var(--dur-fast) var(--ease),filter var(--dur-fast),background-color var(--dur) var(--ease)}
:where(html[data-ds]) button.sec{background:var(--acc2);color:var(--on-action-soft)}
:where(html[data-ds]) button.ghost{background:transparent;color:var(--acc)}
:where(html[data-ds]) button.danger{background:transparent;color:var(--red)}
:where(html[data-ds]) button:disabled{opacity:.45;cursor:not-allowed;filter:saturate(.4)}
:where(html[data-ds]) :is(button,a,input,select,textarea,summary,.chip):focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (hover:hover){:where(html[data-ds]) button:not(:disabled):hover{filter:brightness(1.07)}:where(html[data-ds].dark) button:not(:disabled):hover{filter:brightness(1.12)}}
:where(html[data-ds]) .chip{background:var(--chip);color:var(--txt)}
:where(html[data-ds]) .chip.on,:where(html[data-ds]) .scale button.on{background:var(--grad);color:var(--on-action)}
:where(html[data-ds]) .stepper button{background:var(--chip);color:var(--txt)}
:where(html[data-ds]) input,:where(html[data-ds]) select,:where(html[data-ds]) textarea{background:var(--card);border-color:var(--line);color:var(--txt);border-radius:var(--r-md)}
:where(html[data-ds]) .ds-hero :is(input,select,textarea){background:var(--chip)}
:where(html[data-ds]) .banner{background:var(--surface-soft);color:var(--txt)}
:where(html[data-ds]) .banner.err{background:color-mix(in srgb,var(--fn-err) 12%,var(--card));color:var(--fn-err)}
:where(html[data-ds]) .banner.health{background:color-mix(in srgb,var(--fn-info) 12%,var(--card));color:var(--txt)}
:where(html[data-ds]) .reco{background:var(--surface-soft)}
:where(html[data-ds]) .toast{background:var(--n-900);color:#fff;box-shadow:var(--elev-2)}
:where(html[data-ds].dark) .toast{background:var(--d-txt);color:var(--d-bg)}
:where(html[data-ds]) .sheet{background:var(--card)}
:where(html[data-ds]) .sheet-bg{background:rgba(10,12,16,.45);backdrop-filter:blur(2px)}
/* étiquettes fonctionnelles : couleur + texte, jamais la couleur seule */
:where(html[data-ds]) .tag.red{background:color-mix(in srgb,var(--fn-err) 13%,var(--card));color:var(--fn-err)}
:where(html[data-ds]) .tag.grn,:where(html[data-ds]) .pill{background:color-mix(in srgb,var(--fn-ok) 14%,var(--card));color:var(--fn-ok)}
:where(html[data-ds]) .tag.org{background:color-mix(in srgb,var(--fn-warn-fill) 20%,var(--card));color:var(--fn-warn)}
:where(html[data-ds]) .tag.soon{background:var(--acc2);color:var(--on-action-soft)}
:where(html[data-ds]) .gh.up{color:var(--fn-up)}:where(html[data-ds]) .gh.down{color:var(--fn-down)}
:where(html[data-ds]) .steps .done .num{background:color-mix(in srgb,var(--fn-ok) 16%,var(--card));color:var(--fn-ok)}
:where(html[data-ds]) .reco.warn{border-color:var(--fn-warn-fill)}:where(html[data-ds]) .reco.bad{border-color:var(--fn-err)}:where(html[data-ds]) .reco.good{border-color:var(--fn-ok)}
/* anatomie : groupes musculaires (fonctionnel) */
:where(html[data-ds]) .musc .m.prim{fill:var(--musc-prim)}:where(html[data-ds]) .musc .m.sec{fill:var(--musc-sec)}
:where(html[data-ds]) .mtag{background:color-mix(in srgb,var(--musc-sec) 22%,var(--card))}:where(html[data-ds]) .mtag.p{background:color-mix(in srgb,var(--musc-prim) 20%,var(--card))}
:where(html[data-ds]) .exlast .nx{background:var(--acc2);color:var(--on-action-soft)}
:where(html[data-ds]) .ghostline{background:var(--surface-soft)}

:where(html[data-ds]) nav.tabs{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);box-shadow:0 -1px 0 var(--line)}
:where(html[data-ds]) nav.tabs button{color:var(--mut)}
:where(html[data-ds]) nav.tabs button.on{background:var(--acc2);color:var(--on-action-soft)}
:where(html[data-ds]) nav.tabs button.scanbtn{color:var(--acc)}
:where(html[data-ds]) nav.tabs button.scanbtn span{background:var(--grad);box-shadow:0 6px 18px color-mix(in srgb,var(--grad) 35%,transparent);border-color:var(--card)}
:where(html[data-ds]) nav.tabs button.scanbtn svg path{stroke:var(--on-action)}
/* identité « contextuelle » : l'onglet actif prend la couleur de son univers */
:where(html[data-ds][data-ds-commun=contextuel]) nav.tabs button[data-v=home]{--u-accent:var(--com-accent);--u-pastel:var(--com-pastel);--u-accent-dk:var(--com-accent-dk)}
:where(html[data-ds][data-ds-commun=contextuel]) nav.tabs button[data-v=today]{--u-accent:var(--nut-accent);--u-pastel:var(--nut-pastel);--u-accent-dk:var(--nut-accent-dk)}
:where(html[data-ds][data-ds-commun=contextuel]) nav.tabs button[data-v=fridge]{--u-accent:var(--cui-accent);--u-pastel:var(--cui-pastel);--u-accent-dk:var(--cui-accent-dk)}
:where(html[data-ds][data-ds-commun=contextuel]) nav.tabs button[data-v=workout]{--u-accent:var(--mus-accent);--u-pastel:var(--mus-pastel);--u-accent-dk:var(--mus-accent-dk)}
:where(html[data-ds][data-ds-commun=contextuel]) nav.tabs button[data-v=progress]{--u-accent:var(--pro-accent);--u-pastel:var(--pro-pastel);--u-accent-dk:var(--pro-accent-dk)}
:where(html[data-ds][data-ds-commun=contextuel]) nav.tabs button.on{background:color-mix(in srgb,var(--u-pastel) 50%,var(--card));color:var(--u-accent)}
:where(html[data-ds][data-ds-commun=contextuel].dark) nav.tabs button.on{background:color-mix(in srgb,var(--u-accent-dk) 16%,var(--card));color:var(--u-accent-dk)}
:where(html[data-ds]) .wd{background:var(--chip);color:var(--txt)}
:where(html[data-ds]) .wd.on{background:var(--grad);color:var(--on-action)}:where(html[data-ds]) .wd.on i{color:var(--on-action)}
:where(html[data-ds]) .wd.today{outline-color:var(--acc)}
:where(html[data-ds]) .ktab.on{background:var(--grad);color:var(--on-action);border-color:var(--grad)}
:where(html[data-ds]) .cztabs .czbadge{background:var(--acc);color:var(--card)}:where(html[data-ds]) .cztabs .ktab.on .czbadge{background:var(--on-action);color:var(--grad)}
:where(html[data-ds]) .avatar{background:var(--grad);color:var(--on-action)}
:where(html[data-ds]) .fab{box-shadow:0 6px 18px color-mix(in srgb,var(--grad) 35%,transparent)}
:where(html[data-ds]) .dpill,:where(html[data-ds]) .qa button{background:var(--card);color:var(--txt)}
:where(html[data-ds]) .dtpill,:where(html[data-ds]) .pstats div{background:var(--surface-soft)}
/* minuteur de repos : appartient à la musculation, garde sa couleur sur tous les onglets */
:where(html[data-ds]) .restbar{background:var(--mus-hero);color:#fff;box-shadow:var(--elev-2)}
:where(html[data-ds]) .restbar .restfill{background:var(--mus-soft);opacity:.45}
:where(html[data-ds]) .restbar.over .restfill{background:var(--fn-ok);opacity:.6}
:where(html[data-ds]) .restbar button{background:rgba(255,255,255,.16);color:#fff}
:where(html[data-ds].dark) .restbar{background:color-mix(in srgb,var(--mus-accent-dk) 22%,var(--d-raise));color:var(--d-txt)}
/* B — cartes secondaires colorées */
:where(html[data-ds][data-ds-style=b]) .qa button,:where(html[data-ds][data-ds-style=b]) .dpill,:where(html[data-ds][data-ds-style=b]) .ktab:not(.on){background:var(--surface-sunken)}

/* ---------- Accueil (proposition, aperçu seulement) — tuiles par univers, d'après la maquette de Vuthy ---------- */
:where(html[data-ds]) .dsh-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
@media (max-width:360px){:where(html[data-ds]) .dsh-grid{grid-template-columns:1fr}}
:where(html[data-ds]) .dsh-tile{border-radius:var(--r-lg);padding:var(--sp-3);background:color-mix(in srgb,var(--u-pastel) 30%,var(--u-wash));display:flex;flex-direction:column;gap:var(--sp-2)}
:where(html[data-ds].dark) .dsh-tile{background:color-mix(in srgb,var(--u-tint-dk) 80%,var(--d-card))}
:where(html[data-ds]) .dsh-t{margin:2px 2px 0;font-size:var(--fs-lg);font-weight:var(--fw-semi);color:var(--u-hero)}
:where(html[data-ds].dark) .dsh-t{color:var(--u-accent-dk)}
:where(html[data-ds]) .dsh-deep{background:var(--u-hero);color:#fff;border-radius:var(--r-md);padding:var(--sp-3);display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;font-weight:var(--fw-reg);box-shadow:0 6px 18px color-mix(in srgb,var(--u-hero) 25%,transparent)}
:where(html[data-ds].dark) .dsh-deep{background:color-mix(in srgb,var(--u-accent-dk) 24%,var(--d-card));color:var(--d-txt);box-shadow:none}
:where(html[data-ds]) .dsh-deep svg{width:26px;height:26px;margin-bottom:6px;opacity:.95}
:where(html[data-ds]) .dsh-v{font-size:var(--fs-xl);font-weight:var(--fw-bold);line-height:1.15}
:where(html[data-ds]) .dsh-s{font-size:var(--fs-xs);opacity:.8}
:where(html[data-ds]) .dsh-bar{width:100%;height:5px;border-radius:3px;background:color-mix(in srgb,#fff 18%,transparent);margin-top:8px;overflow:hidden}
:where(html[data-ds]) .dsh-bar>i{display:block;height:100%;border-radius:3px;background:var(--u-pastel)}
:where(html[data-ds].dark) .dsh-bar>i{background:var(--u-accent-dk)}
:where(html[data-ds]) .dsh-ib{padding:6px;color:var(--txt)}:where(html[data-ds]) .dsh-ib svg{width:24px;height:24px;display:block}
:where(html[data-ds]) .dsh-go{background:var(--u-pastel);color:var(--u-hero);width:100%}
:where(html[data-ds].dark) .dsh-go{background:color-mix(in srgb,var(--u-accent-dk) 22%,var(--d-card));color:var(--u-accent-dk)}

@media (prefers-reduced-motion:reduce){:where(html[data-ds]) *{transition:none!important;animation-duration:.01ms!important}}

const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };

}
function macroBar(label, v, max, color) {

}

function computeRecos() {
  const R = []; const T = targets(); const p = profile();
  const ks = [...Array(7)].map((_, i) => addDays(todayKey(), -1 - i)).filter(k => dayTotals(k).kcal >= 800);
  if (ks.length < 4) R.push({ l: "warn", t: "Note tes repas chaque jour", x: `Seulement ${ks.length} journée(s) bien notée(s) sur les 7 derniers jours. Le calcul adaptatif de ta dépense a besoin d'au moins 10 jours notés et de pesées régulières (3-4 par semaine minimum).` });
  if (ks.length) {
    const avg = f => ks.reduce((s, k) => s + dayTotals(k)[f], 0) / ks.length;
    const ap = avg("p"), ak = avg("kcal"), af = avg("fib");
    if (ap < T.p * 0.9) R.push({ l: "bad", t: "Protéines trop basses", x: `Moyenne ${r0(ap)} g/j pour une cible de ${T.p} g (${p.protPerKg} g/kg). Les méta-analyses (Morton 2018) situent le plafond d'efficacité vers 1,6 g/kg, jusqu'à 2,2 g/kg pour être large, surtout en léger déficit. Facile à corriger : skyr, whey, blanc de poulet, œufs.` });
    else R.push({ l: "good", t: "Protéines OK", x: `Moyenne ${r0(ap)} g/j (cible ${T.p} g).` });
    const diff = ak - T.kcal;
    if (Math.abs(diff) > T.kcal * 0.1) R.push({ l: "warn", t: diff > 0 ? "Au-dessus de ta cible calorique" : "En dessous de ta cible calorique", x: `Moyenne ${r0(ak)} kcal/j pour une cible de ${T.kcal} (${diff > 0 ? "+" : ""}${r0(diff)}).` });
    if (af < 25) R.push({ l: "warn", t: "Pas assez de fibres", x: `Moyenne ${r0(af)} g/j (repère EFSA : 25 g minimum, idéal ~30 g). Solution sans effort : un bol de gazpacho ou de velouté par jour (~250-300 ml), des lentilles ou pois chiches en bocal, des fruits rouges dans le skyr, des légumes surgelés poêlés 5 min.` });
  }
  const ws = weightSeries(28);
  if (ws.length > 10) {
    const a = ws[Math.max(0, ws.length - 15)].t, b = ws[ws.length - 1].t; const rate = (b - a) / a * 100 / 2; const [lo, hi] = GOALS[p.goal].rate;
    const msg = `Tendance : ${rate > 0 ? "+" : ""}${Math.round(rate * 100) / 100} % du poids par semaine. Repère pour « ${GOALS[p.goal].label} » : entre ${lo} et ${hi} %/sem.`;

const fridgeDoc = () => Store.get("fridge", {});
const fridgeItems = () => (fridgeDoc().items || []).filter(i => i && i.qty > 0);
function saveFridgeItems(items) { const d = clone(fridgeDoc()) || {}; d.items = items; Store.set("fridge", d); }
const normN = s => (s || "").toLowerCase().replace(/œ/g, "oe").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\(.*?\)/g, "").trim();
const qtyTxt = it => it.unit === "pc" ? `${r1(it.qty)} pièce${it.qty > 1 ? "s" : ""}` : it.qty >= 1000 ? `${r1(it.qty / 1000)} kg` : `${r0(it.qty)} g`;
function fridgeFind(name) {
  const n = normN(name); if (!n) return null;
  const items = fridgeItems();
  const W = s => s.split(/[^a-z0-9]+/).filter(w => w.length > 2 && !["les", "des", "aux", "avec", "cuit", "cru", "crue", "cuite"].includes(w));
  const nw = W(n);
  return items.find(i => normN(i.name) === n) || items.find(i => { const mw = W(normN(i.name)); if (!mw.length || !nw.length) return false; const [a, b] = mw.length <= nw.length ? [mw, nw] : [nw, mw]; return a.every(w => b.some(x => x === w || x === w + "s" || w === x + "s")); }) || null;
}
// quand il mange quelque chose qui est dans le frigo, on le retire
function fridgeConsume(name, g) {
  const it = fridgeFind(name); if (!it || !(g > 0)) return null;
  const items = clone(fridgeDoc().items || []); const x = items.find(i => i.id === it.id);
  x.qty = x.unit === "pc" ? x.qty - g / (x.gPerPc || 100) : x.qty - g;
  if (x.qty <= 0.05) x.qty = 0;

}

}

function drvValue(d, kcal) { if (d[3] != null) return d[3]; const mj = (kcal || 2500) * 0.004184; return d[0] === "thiamin" ? r1(0.1 * mj) : r1(1.6 * mj); }
// ---- ajustement automatique de l'objectif chaque lundi (méthode « dépense adaptative ») ----
function weekKey(d = new Date()) { const t = new Date(d); t.setHours(0, 0, 0, 0); t.setDate(t.getDate() - ((t.getDay() + 6) % 7)); return dateKey(t); }
function weeklyAdjust(tdee, factor, ad) {
  const wk = weekKey(); const A = Store.get("adjust", {}) || {};
  if (A.week === wk && A.kcal) return A;
  const kcal = r0(tdee * (1 + factor));
  const N = { week: wk, kcal, tdee: r0(tdee), prev: A.kcal || null, slope: ad?.slopeWeek != null ? Math.round(ad.slopeWeek * 100) / 100 : null, hist: [...(A.hist || []), ...(A.kcal ? [[A.week, A.kcal]] : [])].slice(-12) };
  setTimeout(() => Store.set("adjust", N), 0); return N;
}

// Poids de la semaine = moyenne des pesées du lundi au dimanche (jusqu'à 7), plus fiable qu'une seule pesée.
function weekWeights(ws0) { const w = []; for (let i = 0; i < 7; i++) { const v = day(addDays(ws0, i)).weight; if (v) w.push(+v); } return { n: w.length, avg: w.length ? r1(w.reduce((a, b) => a + b, 0) / w.length) : null }; }
function weekIntake(ws0) { const k = []; for (let i = 0; i < 7; i++) { const x = addDays(ws0, i); const t = dayTotals(x); if (t.kcal >= 800 && !day(x).incomplete) k.push(t.kcal); } return { n: k.length, avg: k.length ? r0(k.reduce((a, b) => a + b, 0) / k.length) : null }; }

function weekReview() {

  const I = weekIntake(last), T = targets(), A = Store.get("adjust", {}) || {}, ad = adaptiveTDEE(), G = GOALS[profile().goal];

  return { week: last, n, I, T, diff, why, w1, dW: w1 != null && w0 != null ? r1(w1 - w0) : null };
}

const DAY_TYPES = { muscu: ["🏋️", "Muscu"], sport: ["⚽", "Sport"], cardio: ["🏃", "Cardio"], repos: ["😌", "Repos"] };
const SPORT_ACTS = /foot|padel|tennis|basket|hand|rugby|volley|squash|badminton|autre/i; // sports collectifs / raquette → « sport »

// séances faites, indexées par date (une seule lecture par calcul)
function doneIndex() { const I = {}; (typeof workouts === "function" ? workouts() : []).forEach(w => { if (!w.start) return; const k = dateKey(new Date(w.start)); I[k] = true; }); return I; }
function actType(d) { const a = d.acts || []; if (!a.length) return null; return a.some(x => SPORT_ACTS.test(x.type || "")) ? "sport" : "cardio"; }
// type prévu : réglage « semaine type » du profil, sinon deviné sur les 4 dernières semaines
function plannedType(k, I) {
  const wd = (parseKey(k).getDay() + 6) % 7; const plan = nutCfg().plan;
  if (plan && plan[wd]) return plan[wd];

}

  for (let i = 1; i <= 28; i++) { const k = addDays(end, -i), wd = (parseKey(k).getDay() + 6) % 7; if (I[k]) cnt[wd].m++; else { const t = actType(day(k)); if (t === "sport") cnt[wd].s++; else if (t === "cardio") cnt[wd].c++; } }
  return cnt.map(c => c.m >= 2 ? "muscu" : c.s >= 2 ? "sport" : c.c >= 2 ? "cardio" : "repos");
}
function dayTypeInfo(k, I) {

  if (I[k]) return { type: "muscu", src: "fait" };

function dayTargets(k) {

  const type = dayTypeInfo(k, I).type;
  const base = { kcal: T.kcal, p: T.p, g: T.c, l: T.f, c: T.c, f: T.f, type, cycle: false };

}

  workouts().forEach(w => { const h = (now - (w.end || w.start)) / 3600000; if (h > 120 || w.live) return; const decay = Math.exp(-h / 30);
    (w.ex || []).forEach(e => { const n = workSets(e).length; if (!n) return; const x = getEx(e.id);
      x.prim.forEach(m => f[m] = (f[m] || 0) + n * decay); x.sec.forEach(m => f[m] = (f[m] || 0) + n * 0.5 * decay); }); });
  const rec = {}; Object.keys(f).forEach(m => rec[m] = Math.max(0, Math.min(1, 1 - f[m] / 6))); return rec; // 1 = récupéré

// ===================== CUISINE (lot 1) : avec ce que j'ai, courses, budget, batch =====================
// Données (toutes hors ligne, créées à la volée, aucune migration destructive) :
//  "shoplist" {items:[{id,name,qty,unit,aisle,done,src,cost}], log:[{id,t,cost}]}

const CZ_AISLES = [["fl", "Fruits & légumes"], ["viande", "Viandes & poissons"], ["cremerie", "Crèmerie"], ["epicerie", "Épicerie"], ["surgele", "Surgelés"], ["boisson", "Boissons"], ["autre", "Autre"]];
const CZ_CAT2AISLE = { legume: "fl", fruit: "fl", viande: "viande", poisson: "viande", laitier: "cremerie", fromage: "cremerie", oeufs: "cremerie", feculent: "epicerie", sauce: "epicerie", surgele: "surgele", boisson: "boisson" };
const CZ_BASICS = /^(sel|poivre|eau|sel et poivre|sel, poivre)$/;
const czAisle = name => CZ_CAT2AISLE[guessCat(name || "")] || "autre";
const eur = v => v == null ? "—" : v.toFixed(2).replace(".", ",") + " €";
const shopDoc = () => Store.get("shoplist", { items: [], log: [] });
const shopItems = () => shopDoc().items || [];
const priceDoc = () => Store.get("prices", { items: {}, week: null });

function saveShop(fn) { const d = clone(shopDoc()); d.items = d.items || []; d.log = d.log || []; fn(d); d.log = d.log.filter(l => l.t > Date.now() - 60 * 864e5); Store.set("shoplist", d); }

// ---- correspondance de noms (même logique que le frigo) ----
function czMatch(list, name, get = x => x.name) {
  const n = normN(name); if (!n) return null;
  const W = s => s.split(/[^a-z0-9]+/).filter(w => w.length > 2 && !["les", "des", "aux", "avec", "cuit", "cru", "crue", "cuite"].includes(w));
  const nw = W(n);
  return list.find(i => normN(get(i)) === n) || list.find(i => { const mw = W(normN(get(i))); if (!mw.length || !nw.length) return false; const [a, b] = mw.length <= nw.length ? [mw, nw] : [nw, mw]; return a.every(w => b.some(x => x === w || x === w + "s" || w === x + "s")); }) || null;
}
const haveG = it => it.unit === "pc" ? it.qty * (it.gPerPc || 100) : it.qty;
function gPerPcOf(name) { const f = fridgeFind(name); if (f?.gPerPc) return f.gPerPc; const fd = czMatch(allFoods(), name); return fd?.unit || null; }

// ---- objectifs du jour (contrat agent Nutrition : window.dayTargets → {kcal,p,g,l}) ----
function czTargets(k) {
  if (typeof window.dayTargets === "function") { try { const t = window.dayTargets(k); if (t && +t.kcal) return { kcal: +t.kcal, p: +t.p || 0, c: +(t.g ?? t.c) || 0, f: +(t.l ?? t.f) || 0 }; } catch (e) {} }
  const T = targets(); return { kcal: T.kcal, p: T.p, c: T.c, f: T.f };
}
function czRemaining() { const k = todayKey(); const T = czTargets(k); const t = dayTotals(k); return { kcal: Math.max(0, T.kcal - t.kcal), p: Math.max(0, T.p - t.p), c: Math.max(0, T.c - t.c), f: Math.max(0, T.f - t.f) }; }
function czFit(m, R) { // 0..1 : une portion qui comble ce qui reste du jour sans le dépasser
  if (!m || !(m.kcal > 0) || !(R.kcal > 0)) return 0;
  const k = Math.abs(m.kcal - R.kcal) / Math.max(R.kcal, 300), p = R.p > 0 ? Math.max(0, Math.min(R.p, 60) - (m.p || 0)) / Math.max(Math.min(R.p, 60), 20) : 0;
  return Math.max(0, Math.min(1, 1 - 0.5 * Math.min(1, k) - 0.5 * p));
}

// ---- prix et coûts ----
function priceOf(name) { const P = priceDoc().items || {}; const n = normN(name); return P[n] || czMatch(Object.values(P), name) || null; }
function costOf(name, g, pcs) {
  const p = priceOf(name); if (!p || !(p.price > 0)) return null;
  if (p.per === "pc") { if (pcs > 0) return p.price * pcs; const gp = gPerPcOf(name); return p.price * (g > 0 && gp ? g / gp : 1); }
  if (!(g > 0) && pcs > 0) { const gp = gPerPcOf(name) || 100; g = pcs * gp; }
  return g > 0 ? p.price * g / 1000 : null;
}
function costIngs(ings) { let c = 0, known = 0, n = 0; (ings || []).forEach(i => { if (CZ_BASICS.test(normN(i.name))) return; n++; const v = costOf(i.name, +i.g || 0, i.pc); if (v != null) { c += v; known++; } }); return { cost: known ? c : null, known, n }; }
const costTxt = (C, div = 1) => C.cost == null ? `<span class="mut">prix inconnus</span>` : `≈ ${eur(C.cost / div)}${C.known < C.n ? ` <span class="mut">(${C.known}/${C.n} prix connus)</span>` : ""}`;

// ---- recettes : perso + idées gardées (texte IA analysé) ----
function parseIngLine(l) {
  l = l.replace(/^\s*[-•*·–]+\s*|\s*[*_]+/g, "").replace(/\(.*?\)/g, "").trim(); if (!l || l.length > 90) return null;
  const U = { kg: 1000, g: 1, ml: 1, cl: 10, l: 1000 }; let m;
  if ((m = l.match(/^(\d+(?:[.,]\d+)?)\s*(kg|g|ml|cl|l)\b\.?\s*(?:de\s+|d['’]\s*)?(.+)$/i))) return { name: m[3].replace(/[,;].*$/, "").trim(), g: parseFloat(m[1].replace(",", ".")) * U[m[2].toLowerCase()] };
  if ((m = l.match(/^(.+?)\s*[:=]\s*(\d+(?:[.,]\d+)?)\s*(kg|g|ml|cl|l)\b/i))) return { name: m[1].trim(), g: parseFloat(m[2].replace(",", ".")) * U[m[3].toLowerCase()] };
  if ((m = l.match(/^(\d+(?:[.,]\d+)?)\s+(.+)$/))) return { name: m[2].replace(/[,;].*$/, "").trim(), pc: parseFloat(m[1].replace(",", ".")) };
  return null;
}
function parseIdeaDishes(note) {
  const out = []; let cur = null, inIng = false;
  String(note.text || "").split("\n").forEach(raw => {
    const l = raw.trim(); const d = l.match(/^[#*\s]*🍽️?\s*(.+?)\s*$/u);
    if (d) { cur = { name: d[1].split("|")[0].replace(/^[*#\s:]+|[*#\s:]+$/g, ""), ings: [], body: [] }; out.push(cur); inIng = false; return; }
    if (!cur || !l) return; cur.body.push(l);
    if (/ingr[ée]dient/i.test(l)) { inIng = true; const after = l.split(/:\s*/).slice(1).join(":"); if (after) after.split(/[,;]/).forEach(x => { const p = parseIngLine(x); if (p) cur.ings.push(p); }); return; }
    if (/mat[ée]riel|[ée]tapes?|pr[ée]paration|cuisson|rep[èe]res|erreurs?|astuce|macros|^\d+\)/i.test(l)) { inIng = false; return; }
    const p = parseIngLine(l); if (p && (inIng || p.g)) cur.ings.push(p);
  });
  return out.filter(x => x.name && x.ings.length).map((x, i) => {
    const B = x.body.join(" "), n = re => { const m = B.match(re); return m ? +m[1] : 0; };
    const per = { kcal: n(/(\d{2,4})\s*kcal/i), p: n(/(?:\bP\b|prot[ée]ines?)\s*[:=]?\s*(\d+)\s*g/i) || n(/(\d+)\s*g\s*(?:de\s*)?prot/i), c: n(/(?:\bG\b|glucides)\s*[:=]?\s*(\d+)/i), f: n(/(?:\bL\b|lipides)\s*[:=]?\s*(\d+)/i) };
    return { kind: "idee", id: note.id + ":" + i, name: x.name, ings: x.ings, portions: 1, per };
  });
}
function czRecipes() {
  const perso = recipes().map(r => { const f = recipeAsFood(r); const u = f.unit; return { kind: "perso", id: r.id, name: r.name, ings: (r.ings || []).map(i => ({ name: i.name, g: +i.g || 0 })), portions: r.portions || 1, per: { kcal: f.per100.kcal * u / 100, p: f.per100.p * u / 100, c: f.per100.c * u / 100, f: f.per100.f * u / 100 } }; });
  const ideas = (Store.get("notes", { items: [] }).items || []).flatMap(parseIdeaDishes);
  return [...perso, ...ideas];
}
function czAvail(ings) {
  const list = (ings || []).filter(i => !CZ_BASICS.test(normN(i.name)));
  const have = [], miss = [], urgent = [];
  list.forEach(i => { const it = fridgeFind(i.name); if (it) { have.push(i); if (expSoon(it)) urgent.push(it); } else miss.push(i); });
  return { n: list.length, have: have.length, miss, urgent };
}
function recipesAvailHTML() {

  const rows = czRecipes().map(r => Object.assign(r, { A: czAvail(r.ings), fit: czFit(r.per, R), C: costIngs(r.ings) }));

      <div class="sm czav"><b>${r.A.have}/${r.A.n}</b>${r.A.miss.length ? ` — il manque : ${r.A.miss.map(i => esc(i.name)).join(", ")}` : " — tout est là ✓"}</div>

      <div class="xs mut">${r.per.kcal ? `${r0(r.per.kcal)} kcal · P ${r0(r.per.p)} g / portion` : "macros non précisées"}${r.fit >= 0.7 ? ` · <b style="color:var(--acc)">colle à ce qu'il te reste</b>` : ""} · ${costTxt(r.C, r.portions)}${r.portions > 1 ? "/portion" : ""}</div>

// ---- liste de courses ----
function shopAddMissing(ings, src) { // ings : [{name, g?, pc?}] (quantités totales voulues) → n'ajoute que ce qui manque
  const need = {};
  ings.forEach(i => { if (!i.name || CZ_BASICS.test(normN(i.name))) return; const k = normN(i.name); const x = need[k] || (need[k] = { name: i.name, g: 0, pc: 0 }); x.g += +i.g || 0; x.pc += +i.pc || 0; });
  let added = 0;
  saveShop(d => Object.values(need).forEach(x => {
    const it = fridgeFind(x.name); let g = x.g, pc = x.pc;
    if (it) { if (it.unit === "pc" && pc && !g) pc -= it.qty; else if (g) g -= haveG(it); else return; if (g <= 0 && pc <= 0) return; }
    const unit = g > 0 ? "g" : pc > 0 ? "pc" : ""; const qty = unit === "g" ? Math.ceil(g / 10) * 10 : unit === "pc" ? Math.ceil(pc) : 0;
    const ex = d.items.find(s => !s.done && normN(s.name) === normN(x.name) && (s.unit || "") === unit);
    if (ex) ex.qty = (ex.qty || 0) + qty; else d.items.push({ id: uid(), name: x.name, qty, unit, aisle: czAisle(x.name), done: false, src: src || "" });
    added++;
  }));
  return added;
}

// ===================== MINUTEUR DE REPOS + ÉCRAN ALLUMÉ =====================
// Après chaque série validée : compte à rebours flottant (durée selon l'exercice, réglable et mémorisée),

const REST = { end: 0, total: 0, exId: null, iv: null };
function restDefault(exId) {
  try { const m = JSON.parse(localStorage.getItem("muscu_rest") || "{}"); if (m[exId]) return m[exId]; } catch (e) {}
  return 150; // 2 min 30 pour tous les exercices (Vuthy précisera plus tard exercice par exercice)
}
try { if (!localStorage.getItem("muscu_rest_v2")) { localStorage.removeItem("muscu_rest"); localStorage.setItem("muscu_rest_v2", "1"); } } catch (e) {}
function restSave(exId, sec) { try { const m = JSON.parse(localStorage.getItem("muscu_rest") || "{}"); m[exId] = sec; localStorage.setItem("muscu_rest", JSON.stringify(m)); } catch (e) {} }
function restStart(exId, warmup) {
  const sec = warmup ? 60 : restDefault(exId);
  REST.exId = exId; REST.total = sec; REST.end = Date.now() + sec * 1000; REST.done = false; restTick();
  clearInterval(REST.iv); REST.iv = setInterval(restTick, 250);
}
function restStop() { clearInterval(REST.iv); REST.iv = null; REST.end = 0; const el = document.getElementById("restBar"); if (el) el.remove(); }
function restBeep() {
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
  try { const A = window.AudioContext || window.webkitAudioContext; const ctx = REST.ctx || (REST.ctx = new A());
    [0, 0.25].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.18);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2); }); } catch (e) {}
}
function restTick() {
  if (!REST.end) return; let el = document.getElementById("restBar");
  if (!el) { el = document.createElement("div"); el.id = "restBar"; el.className = "restbar"; document.body.appendChild(el);
    el.addEventListener("click", e => { const b = e.target.closest("[data-r]"); if (!b) return; const k = b.dataset.r;
      if (k === "x") return restStop();
      const d = +k; REST.end += d * 1000; REST.total = Math.max(15, REST.total + d); if (REST.exId) restSave(REST.exId, Math.max(15, Math.round((restDefault(REST.exId) + d) / 15) * 15)); restTick(); }); }
  const left = Math.max(0, Math.round((REST.end - Date.now()) / 1000));
  if (left === 0 && !REST.done) { REST.done = true; restBeep(); setTimeout(restStop, 4000); }
  const pct = REST.total ? Math.min(100, 100 * (1 - left / REST.total)) : 100;
  el.classList.toggle("over", left === 0);
  el.innerHTML = `<div class="restfill" style="width:${pct}%"></div><div class="restin"><span>${left === 0 ? "C'est reparti 💪" : "Repos"}</span><b>${fmtDur(left * 1000)}</b>
    <button data-r="-15">−15 s</button><button data-r="15">+15 s</button><button data-r="x" aria-label="Fermer">✕</button></div>`;
}
// écran allumé pendant la séance
let WAKE = null;
async function wakeSync() {

  try {
    if (want && !WAKE && navigator.wakeLock) { WAKE = await navigator.wakeLock.request("screen"); WAKE.addEventListener("release", () => { WAKE = null; }); }
    else if (!want && WAKE) { await WAKE.release(); WAKE = null; }
  } catch (e) { WAKE = null; }
}

function platesFor(total, bar = 20) {
  const per = (total - bar) / 2; if (per < 0) return null; const P = [25, 20, 15, 10, 5, 2.5, 1.25]; let r = per; const out = [];
  P.forEach(p => { while (r >= p - 1e-9) { out.push(p); r = r1(r - p); } }); return { per, out, rest: r };
}

}

// ===================== GLISSER ENTRE LES SECTIONS (comme les onglets de Clash Royale) =====================
const SWIPE_TABS = ["today", "fridge", "workout", "progress", "coach", "profile"];
const SW = { on: false };
function swipeBlocked(t) {
  if (S.sheet || !SWIPE_TABS.includes(S.tab)) return true;
  for (let el = t; el && el !== document.body; el = el.parentElement) {
    if (el.id === "scene3d" || el.tagName === "CANVAS" || el.classList?.contains("navpad") || el.id === "nav") return true;
    if (/INPUT|TEXTAREA|SELECT/.test(el.tagName)) return true;
    const cs = getComputedStyle(el); if (/(auto|scroll)/.test(cs.overflowX) && el.scrollWidth > el.clientWidth + 4) return true;
  }
  return false;
}
function swipeGo(dir) { // dir = +1 → section de droite, -1 → section de gauche
  const i = SWIPE_TABS.indexOf(S.tab), j = i + dir; const app = $("#app");
  if (j < 0 || j >= SWIPE_TABS.length) { app.style.transition = "transform .2s"; app.style.transform = ""; return; }
  app.style.transition = "transform .16s ease-in, opacity .16s"; app.style.transform = `translateX(${-dir * 100}%)`; app.style.opacity = ".3";
  setTimeout(() => { S.tab = SWIPE_TABS[j]; S.sheet = null; window.scrollTo(0, 0); render();
    app.style.transition = "none"; app.style.transform = `translateX(${dir * 40}%)`; app.style.opacity = ".3";
    requestAnimationFrame(() => requestAnimationFrame(() => { app.style.transition = "transform .2s ease-out, opacity .2s"; app.style.transform = ""; app.style.opacity = ""; })); }, 150);
}
document.addEventListener("touchstart", e => { const tx = e.touches[0]?.clientX ?? 0; const fromEdge = tx < 28 || tx > window.innerWidth - 28;
  if (e.touches.length !== 1 || S.sheet || (!fromEdge && swipeBlocked(e.target))) { SW.on = false; return; }
  SW.on = true; SW.drag = false; SW.x = e.touches[0].clientX; SW.y = e.touches[0].clientY; SW.t = performance.now(); SW.dx = 0; }, { passive: true });
document.addEventListener("touchmove", e => { if (!SW.on) return; const dx = e.touches[0].clientX - SW.x, dy = e.touches[0].clientY - SW.y;
  if (!SW.drag) { if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { SW.on = false; return; } if (Math.abs(dx) > 14 && Math.abs(dx) > 1.3 * Math.abs(dy)) SW.drag = true; else return; }
  e.preventDefault(); const i = SWIPE_TABS.indexOf(S.tab); const edge = (dx > 0 && i === 0) || (dx < 0 && i === SWIPE_TABS.length - 1);
  SW.dx = dx; const app = $("#app"); app.classList.add("swiping"); app.style.transition = "none"; app.style.transform = `translateX(${edge ? dx * 0.2 : dx}px)`; }, { passive: false });
document.addEventListener("touchend", () => { if (!SW.on) return; SW.on = false; const app = $("#app"); app.classList.remove("swiping"); if (!SW.drag) return;
  const v = Math.abs(SW.dx) / Math.max(1, performance.now() - SW.t);
  if (Math.abs(SW.dx) > window.innerWidth * 0.22 || (v > 0.5 && Math.abs(SW.dx) > 40)) swipeGo(SW.dx < 0 ? 1 : -1);
  else { app.style.transition = "transform .2s ease-out"; app.style.transform = ""; } });
// Mac : glisser à deux doigts sur le trackpad
let wheelAcc = 0, wheelLock = 0, wheelT = 0;
document.addEventListener("wheel", e => { if (Math.abs(e.deltaX) < Math.abs(e.deltaY) * 1.5 || swipeBlocked(e.target)) return;
  const now = performance.now(); if (now < wheelLock) return; if (now - wheelT > 250) wheelAcc = 0; wheelT = now; wheelAcc += e.deltaX;
  if (Math.abs(wheelAcc) > 140) { wheelLock = now + 700; swipeGo(wheelAcc > 0 ? 1 : -1); wheelAcc = 0; } }, { passive: true });

// ===================== DÉPENSE ÉNERGÉTIQUE DES SÉRIES =====================
// Base scientifique (mesures, pas des chiffres au hasard) :
//  • Scott, Luchini, Knausenberger & Steitz 2014, Central European Journal of Sport Sciences and Medicine 8(4):53-59.
//    Coût TOTAL d'une série = aérobie pendant l'effort + anaérobie (lactate) + EPOC (récupération), mesuré par
//    calorimétrie indirecte, 22 hommes (83 kg, 180,5 cm) et 16 femmes. Le coût est une fonction linéaire du TRAVAIL :
//    travail = charge (kg) × distance verticale parcourue (m) × répétitions.
//      squat      : coût (kJ) = 14.931 + 0.0942 × travail   (r = 0.977)
//      soulevé    : coût (kJ) = 56.592 + 0.102  × travail   (r = 0.997)
//      dév. incliné: coût (kJ) = 3.21  + 0.0911 × travail   (r = 0.947)
//      shrug      : coût (kJ) = 0.0455 + 0.246  × travail   (r = 0.921)
//      mollets    : coût (kJ) = 1.945 + 0.296  × travail    (r = 0.941)
//    Répartition moyenne : 18 % aérobie pendant la série, 31 % anaérobie, 51 % EPOC.
//  • Reis et al. 2017, PLoS One 12(7):e0181311 (58 hommes, 78,7 kg) : contrôle de cohérence pour les machines et
//    l'isolation (presse, leg extension, tirage, curl, triceps) et confirmation que les jambes coûtent plus cher.
//  • Robergs et al. 2007, J Strength Cond Res 21(1):123-130 : la charge et la distance parcourue prédisent le coût
//    (le poids du corps n'entre pas dans leur équation, sauf quand c'est lui qu'on soulève).
// Modélisation (calculs, pas de nouvelles données) :
//  • chaque exercice est rattaché au mouvement mesuré le plus proche (même masse musculaire / même schéma) ;
//  • la distance de référence (pour 180,5 cm) est ajustée à ta taille ;
//  • quand le corps bouge avec la charge (squat, fentes, tractions, dips…), la partie du corps soulevée est
//    ajoutée à la charge (travail = masse du « système » × distance, méthode de McBride et al. 2009) ;
//  • 1 kcal = 4,184 kJ. Résultat = dépense NETTE due à la série (au-dessus du repos).
const EN_MODELS = {
  squat: { a: 14.931, b: 0.0942, n: "squat (Scott 2014)" }, dead: { a: 56.592, b: 0.102, n: "soulevé de terre (Scott 2014)" },
  press: { a: 3.21, b: 0.0911, n: "développé incliné (Scott 2014)" }, isoUp: { a: 0.0455, b: 0.246, n: "shrug / petits muscles du haut (Scott 2014)" },
  isoLow: { a: 1.945, b: 0.296, n: "mollets / isolation des jambes (Scott 2014)" }
};
// m = modèle, d = distance verticale (m) pour 180,5 cm, bw = part du poids du corps soulevée, k = multiplicateur de charge (2 haltères)
const EN_EX = {
  lat_raise_cable: { m: "isoUp", d: 0.4 }, lat_raise_db: { m: "isoUp", d: 0.55, k: 2 }, shoulder_press: { m: "press", d: 0.5 }, face_pull: { m: "isoUp", d: 0.4 },
  rear_delt_fly: { m: "isoUp", d: 0.4 }, tri_oh_cable: { m: "isoUp", d: 0.4 }, tri_push_uni: { m: "isoUp", d: 0.35 }, tri_push_rope: { m: "isoUp", d: 0.35 },

const SPLITS = {

// ---------- fiche exercice : photo (ou 3D), muscles ciblés, variantes par matériel ----------
// i = position de l'exercice dans la séance en cours (actions « Utiliser », « Pas envie », etc.)
function exMuscleSheet(exId, i) {
  S.exEq = null;
  return () => {
    const x = getEx(exId), db = EX_DB[exId], live = i != null && liveWorkout()?.ex[i]?.id === exId;
    const img = db?.[1], media = img && S.exMedia !== "3d" ? "photo" : "3d";
    const mn = m => esc(MUSCLES[m]?.[0] || m);
    const also = x.prim.filter(m => !x.focus.includes(m)).concat(x.sec);
    const groups = db ? Object.keys(EQ_LABEL).filter(k => db[2].some(v => v[0] === k)) : [];
    const cur = groups.includes(S.exEq) ? S.exEq : groups.includes(db?.[0]) ? db[0] : groups[0];
    const row = ([, n, d, id, p]) => `<div class="entry exv">${p ? `<div class="exvt"><img src="${exImg(p)}" loading="lazy" alt="" onerror="this.parentNode.remove()"></div>` : ""}
      <div class="grow"><div class="sm b">${esc(n)}</div><div class="xs mut">${esc(d)}</div></div>${id && live ? `<button class="ghost small" data-act="useVar" data-v="${id}" data-i="${i}">Utiliser</button>` : ""}</div>`;
    const cues = EX_CUES[x.id] || [], roles = x.prim.concat(x.sec).filter((m, k, a) => a.indexOf(m) === k && MUSCLE_INFO[m]);
    const [lo, hi] = repRange(exId);
    return `<div class="row between"><h2 style="margin:0">${esc(x.name)}</h2><button class="sec small" data-act="closeSheet">Fermer</button></div>
      ${img ? `<div class="chips exmedia"><button class="chip ${media === "photo" ? "on" : ""}" data-act="exMedia" data-v="photo">Photo</button><button class="chip ${media === "3d" ? "on" : ""}" data-act="exMedia" data-v="3d">3D</button></div>` : ""}
      ${media === "photo" ? `<div class="exph"><img src="${exImg(img, 0)}" alt="" onerror="this.parentNode.remove()"><img class="b" src="${exImg(img, 1)}" alt=""></div>` : body3DHolderHTML("min(46vh, 420px)", true)}
      <div class="exmus"><span class="xs mut">Ciblé</span>${x.focus.map(m => `<span class="mtag p">${mn(m)}</span>`).join("")}${also.length ? `<br><span class="xs mut">Aussi</span>${also.map(m => `<span class="mtag">${mn(m)}</span>`).join("")}` : ""}</div>
      ${groups.length ? `<h3>Variantes</h3><div class="chips">${groups.map(k => `<button class="chip ${k === cur ? "on" : ""}" data-act="exEq" data-v="${k}">${EQ_LABEL[k]}</button>`).join("")}</div>
        ${groups.map(k => `<div class="exvar ${k === cur ? "on" : ""}" data-eq="${k}">${db[2].filter(v => v[0] === k).map(row).join("")}</div>`).join("")}` : ""}
      ${cues.length || x.note || roles.length ? `<details class="exhow"><summary>Bien le faire</summary>${cues.length ? `<ol class="sm">${cues.map(c => `<li>${esc(c)}</li>`).join("")}</ol>` : ""}${x.note ? `<div class="reco sm">${esc(x.note)}</div>` : ""}
        ${roles.map(m => `<p class="xs" style="margin:4px 0"><b>${mn(m)}</b> — ${esc(MUSCLE_INFO[m])}</p>`).join("")}${img ? `<p class="xs mut">Photos : free-exercise-db (domaine public).</p>` : ""}</details>` : ""}
      ${live ? `<div class="exacts"><label class="xs mut">Reps visées <select data-act="range" data-v="${exId}">${[[6, 8], [6, 10], [8, 10], [8, 12], [10, 15], [12, 20]].map(([a, b]) => `<option value="${a}-${b}" ${a === lo && b === hi ? "selected" : ""}>${a}-${b}</option>`).join("")}</select></label>
        <div class="row" style="gap:6px"><button class="ghost small" data-act="refuse" data-i="${i}">🚫 Pas envie</button>${i > 0 ? `<button class="ghost small" data-act="exMove" data-i="${i}">↑ Monter</button>` : ""}<button class="ghost small dangertxt" data-act="exDrop" data-i="${i}">Retirer</button></div></div>` : ""}`;
  };
}

// ---------- carte d'exercice pendant la séance : une série = 1 tap (2 si on ajuste) ----------
function exDraft(w, e, i) {
  const [lo, hi] = repRange(e.id); const sug = suggestion(e.id, w._id); const last = exerciseHistory(e.id, w._id)[0];
  const ws = (e.sets || []).filter(s => !s.wu), lastW = ws.slice(-1)[0], gs = last ? last.sets.filter(z => !z.wu)[ws.length] : null;
  const dr = S.draft[i] || (S.draft[i] = { w: lastW?.w ?? sug.w ?? gs?.w ?? "", r: "", rir: null, wu: false });
  // reps toujours pré-remplies : la série précédente, sinon l'objectif du conseil (charge montée → bas de fourchette ; sinon +1 rep vs la dernière fois)
  if (dr.r === "" || dr.r == null) dr.r = lastW?.r ?? (sug.up ? lo : gs ? Math.min(Math.max(gs.r + 1, lo), hi) : hi);
  return dr;
}
const setLbl = dr => dr.w !== "" && dr.r !== "" ? `${dr.w} kg × ${dr.r}` : "";
function exCard(w, e, i) {

      <div class="xs mut">${ws.length} série${ws.length > 1 ? "s" : ""} · ${ws.map(s => `${s.w}×${s.r}${s.rir != null ? ` @${s.rir}` : ""}`).join(" · ")}</div></div><button class="ghost small" data-act="exReopen" data-i="${i}">Modifier</button></div></div>`; }
  const x = getEx(e.id); const sug = suggestion(e.id, w._id); const last = exerciseHistory(e.id, w._id)[0];
  const prev = e.sets || [], nW = prev.filter(s => !s.wu).length, lastSets = last ? last.sets.filter(z => !z.wu) : [];
  const dr = exDraft(w, e, i);
  const dl = isDeload() ? `<div class="reco xs" style="margin:6px 0">🔋 Décharge : environ <b>${Math.max(1, Math.round((program()[w.name]?.sets?.[e.id] || 3) / 2))} série(s)</b> à la charge habituelle, 3-4 reps en réserve.</div>` : "";

    ${last ? `<div class="xs mut exlast">Dernière fois (${fmtDay(dateKey(new Date(last.date)))}) : ${lastSets.map((s, k) => `<span class="${k === nW ? "nx" : ""}">${s.w}×${s.r}${s.rir != null ? ` @${s.rir}` : ""}</span>`).join(" · ")}</div>` : ""}
    <div class="reco ${sug.up ? "good" : ""} sm">${esc(sug.text)}</div>
    ${prev.map((s, j) => { const rest = j > 0 ? s.t - prev[j - 1].t : null; const n = prev.slice(0, j + 1).filter(z => !z.wu).length; const ghostSet = !s.wu ? lastSets[n - 1] : null;
      return `<div class="set ${s.wu ? "wu" : ""}"><span class="mut">${s.wu ? "É" : n}</span><span class="b">${s.w} kg</span><span class="b">× ${s.r} ${s.wu ? "" : ghostBadge(ghostCmp(s, ghostSet))}</span><span class="xs">${s.rir != null && !s.wu ? "RIR " + s.rir : ""}${rest ? ` · ${fmtDur(rest)}` : ""}</span><button class="danger small" data-act="delSet" data-i="${i}" data-j="${j}">✕</button></div>`; }).join("")}
    ${ghostSummary(e, last)}

// ===================== FATIGUE CUMULÉE → DÉCHARGE CONSEILLÉE =====================
// Calcul caché : chaque semaine reçoit un score de fatigue (0 à 1) à partir de plusieurs signaux.
// La décharge n'est proposée que si la fatigue reste élevée plusieurs semaines de suite.
//
// Signaux par semaine (lundi → dimanche) :
//  1. nombre de séances par rapport à tes habitudes (médiane des 8 semaines d'avant)
//  2. séries dures (principal 1, secondaire ½) par rapport à tes habitudes
//  3. « jours rouges » : jours où au moins 2 groupes musculaires étaient à moins de 35 % de récupération
//  4. performances : part des séries moins bonnes que la dernière fois (▼)
//  5. effort : part des séries à RIR 0 (à l'échec)
//  6. ressenti : énergie / récup / motivation du bilan hebdo, énergie / stress / sommeil du journal
// Règle : décharge conseillée si ≥ 2 des 3 dernières semaines complètes ont un score ≥ 0,55
// (ou 1 seule ≥ 0,75 avec une semaine en cours déjà ≥ 0,55), au moins 5 semaines après la
// dernière décharge, et seulement si tu t'entraînes régulièrement (≥ 2 séances/sem. en moyenne).
const FAT = { cache: null, t: 0 };
const weekStartKey = k => { const d = parseKey(k); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return dateKey(d); };
function loadAt(ts, ws) { // charge par muscle à un instant donné (même modèle que la carte de récupération)
  const f = {}; ws.forEach(w => { const h = (ts - (w.end || w.start)) / 3600000; if (h < 0 || h > 120 || w.live) return; const dec = Math.exp(-h / 30);
    (w.ex || []).forEach(e => { const n = workSets(e).length; if (!n) return; const x = getEx(e.id); if (!x) return;
      x.prim.forEach(m => f[m] = (f[m] || 0) + n * dec); x.sec.forEach(m => f[m] = (f[m] || 0) + n * 0.5 * dec); }); });
  const g = {}; Object.entries(f).forEach(([m, v]) => { const gr = MUSCLES[m]?.[1]; if (gr) g[gr] = Math.max(g[gr] || 0, v); }); return g;
}

let _zx = null;
function loadZXing() { if (_zx) return _zx; _zx = new Promise(res => { const s = document.createElement("script"); s.src = "https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"; s.onload = () => res(window.ZXing || null); s.onerror = () => res(null); document.head.appendChild(s); setTimeout(() => res(window.ZXing || null), 8000); }); return _zx; }
async function decodeBarcode(file) {
  try { const Z = await loadZXing(); if (!Z) return null; const url = URL.createObjectURL(file);
    const hints = new Map(); hints.set(Z.DecodeHintType.TRY_HARDER, true);
    const reader = new Z.BrowserMultiFormatReader(hints); const r = await reader.decodeFromImageUrl(url); return r?.getText?.() || r?.text || null; } catch (e) { return null; }
}
async function handleBarcode(code) {
  const f = myFoods()["bc" + code];
  if (f) { S.add.sel = f; S.add.g = f.unit || 100; S.add.busy = false; renderSheet(); return; }
  S.add.busy = true; renderSheet();
  const off = await offBarcode(code);
  if (off) { const saved = saveMyFood(off); toast("Produit trouvé : " + off.name); S.add.sel = saved; S.add.g = saved.unit || 100; S.add.busy = false; renderSheet(); return; }
  S.add.scan = { step: "label", barcode: code }; S.add.busy = false; renderSheet();
}
async function onFile(kind, file) {
  if (!file) return; S.add.err = "";
  if (kind === "shop") { S.shop.busy = true; S.shop.err = ""; renderSheet(); try { const b = await shrinkImage(file, 1600); const r = await aiShop("", b); S.shop.items = (r?.items || []).filter(x => x && x.name && x.qty > 0); if (!S.shop.items.length) S.shop.err = "Rien reconnu sur la photo."; } catch (e) { S.shop.err = aiErr(e); } S.shop.busy = false; renderSheet(); return; }
  if (kind === "physique") { try { const b = await shrinkImage(file, 1400); await phAdd(b, S.phView || "face"); toast("Photo ajoutée 📸"); } catch (e) { toast("Impossible d'enregistrer la photo"); } render(); return; }
  if (kind === "photo") { S.add.blob = await shrinkImage(file); S.add.img = URL.createObjectURL(S.add.blob); renderSheet(); return; }
  if (kind === "barcode") {
    S.add.busy = true; renderSheet();
    let code = await decodeBarcode(file);
    if (!code) { try { const small = await shrinkImage(file, 1600); const r = await aiBarcodeDigits(small); code = (r?.barcode || "").replace(/\D/g, ""); } catch (e) { S.add.err = aiErr(e); } }
    if (!code) { S.add.busy = false; S.add.err = S.add.err || "Code illisible : reprends la photo plus près, ou tape le code."; renderSheet(); return; }
    handleBarcode(code); return;
  }
  if (kind === "label") {
    S.add.busy = true; renderSheet();
    try { const blob = await shrinkImage(file, 1600); const r = await aiLabel(blob);
      const per100 = Object.fromEntries(NUTR_KEYS.map(k => [k, r?.per100?.[k] == null ? 0 : +r.per100[k]]));
      if (!per100.kcal && !per100.p && !per100.c) throw { message: "étiquette illisible, reprends la photo bien à plat" };
      const code = S.add.scan?.barcode || (r.barcode || "").replace(/\D/g, "") || null;
      const food = saveMyFood({ name: r.name || "Produit scanné", brand: r.brand || "", barcode: code, per100, unit: r.servingG || null });
      toast("Produit enregistré dans tes aliments"); S.add.sel = food; S.add.g = food.unit || 100; S.add.scan = null;
    } catch (e) { S.add.err = e?.code ? aiErr(e) : "Erreur : " + (e?.message || ""); }
    S.add.busy = false; renderSheet();
  }
}

  else if (k === "itemG") { S.add.items[+el.dataset.i].grams = +el.value || 0; }
  else if (k === "fq") { S.fq = el.value; const res = searchFoods(el.value).slice(0, 12); S._fres = res; $("#fres").innerHTML = fridgeResHTML(res, el.value); }
  else if (k === "shopQ") { S.shop.items[+el.dataset.i].qty = +el.value || 0; }
  else if (k === "recQ") { S.rec.q = el.value; const res = searchFoods(el.value).slice(0, 8); S._recRes = res; $("#recRes").innerHTML = res.map((f, i) => `<div class="entry" data-act="recAddIng" data-i="${i}"><span class="sm">${esc(f.name)}</span><span class="mut">+</span></div>`).join(""); }
  else if (k === "recG") { S.rec.ings[+el.dataset.i].g = +el.value || 0; }
  else if (k === "recP") { S.recPortions = parseFloat(el.value) || 1; }
  else if (k === "phSplit") { S.phSplit = +el.value; const t = $("#phTop"), l = $("#phLine"); if (t) t.style.clipPath = `inset(0 0 0 ${el.value}%)`; if (l) l.style.left = el.value + "%"; }
  else if (k === "draft") { const dr = S.draft[+el.dataset.i]; if (dr) dr[el.dataset.k] = el.value; }
  else if (k === "exQ") { S.exQ = el.value; const sh = exPickerSheet("add")(); const tmp = document.createElement("div"); tmp.innerHTML = sh; $("#exList").innerHTML = tmp.querySelector("#exList").innerHTML; }
});

// ===================== DESIGN SYSTEM 2 (section Design) =====================
// ACTIF par défaut (choix de Vuthy du 26-27/11 : Black Cherry, style C, neutre + accents, accueil).
// « ?ds=0 » dans l'adresse = ancien design (comparaison). Les autres paramètres (?ds=1&m=…&s=…&c=…&mode=…&screen=…)
// et postMessage servent seulement à la page dev/apercu-design.html. Rien n'est écrit dans le stockage
// ni dans les réglages ; aucune donnée ni aucun calcul n'est touché.
const DS = { ctrl: false, on: true, o: { muscu: "cherry", style: "c", commun: "contextuel", mode: "" } };

// Couleur d'un jeton, résolue en « rgb(...) » (Chart.js, canvas) ou en nombre 0xRRGGBB (Three.js).
// Fonctionne aussi pour les jetons calculés (color-mix). el = élément dont on prend le contexte (carte foncée…).
function dsColor(name, fallback, el) {
  if (!DS.on) return fallback;
  const p = document.createElement("i"); p.style.cssText = `display:none;color:var(${name})`; (el || document.body).appendChild(p);
  const c = getComputedStyle(p).color; p.remove();
  const m = c.match(/^color\(srgb ([\d.]+) ([\d.]+) ([\d.]+)/);
  return m ? `rgb(${Math.round(m[1] * 255)}, ${Math.round(m[2] * 255)}, ${Math.round(m[3] * 255)})` : (c || fallback);
}
function dsHex(name, fallback) {
  if (!DS.on) return fallback;
  const m = (dsColor(name, "") || "").match(/(\d+),\s*(\d+),\s*(\d+)/);
  return m ? (+m[1] << 16) | (+m[2] << 8) | +m[3] : fallback;
}
const DS_UNIV = { today: "nutrition", fridge: "cuisine", workout: "muscu", progress: "progression", coach: "commun", profile: "commun", home: "commun" };

function dsSet(o) {
  Object.assign(DS.o, o || {});
  if ("on" in (o || {})) DS.on = !!o.on;
  const h = document.documentElement, x = DS.o;
  if (DS.on) { h.dataset.ds = "2"; h.dataset.dsMuscu = x.muscu; h.dataset.dsStyle = x.style; h.dataset.dsCommun = x.commun; }
  else ["ds", "dsMuscu", "dsStyle", "dsCommun", "u"].forEach(k => delete h.dataset[k]);
  if (x.mode) h.classList.toggle("dark", x.mode === "dark"); // aperçu seulement : pas de localStorage
}

// Après chaque rendu : univers de l'écran, carte principale, graphiques
function dsAfter() {
  const h = document.documentElement, nav = document.getElementById("nav");
  if (DS.ctrl) [...document.querySelectorAll("#app .banner")].forEach(b => { if (/Mode aperçu/.test(b.textContent)) b.remove(); });
  if (!DS.on) { if (nav) delete nav.dataset.u; return; }
  h.dataset.u = DS_UNIV[S.tab] || "commun"; if (nav) nav.dataset.u = "commun";
  document.querySelectorAll(".ds-hero").forEach(e => e.classList.remove("ds-hero"));
  const app = document.getElementById("app"); let hero = null;
  if (S.tab === "home") hero = null; // l'accueil a ses propres cartes profondes
  else if (S.tab === "today") hero = app.querySelector(".ring")?.closest(".card");
  else if (S.tab === "progress") hero = app.querySelector("canvas")?.closest(".card");
  else if (S.tab === "workout") hero = app.querySelector(".set,.exhead")?.closest(".card") || app.querySelector(".card");
  else hero = app.querySelector(".card");
  if (hero) hero.classList.add("ds-hero");
  dsCharts();
}
// Couleurs des graphiques (lues par drawCharts dans ui.js) : jetons Progression, lisibles sur la carte foncée.
function dsChartColors(canvas) {
  const el = canvas && canvas.closest(".card");
  return { point: dsColor("--chart-2", "#94a3b8", el), trend: dsColor("--chart-1", "#2563eb", el), bars: dsColor("--chart-3", "#60a5fa", el),
    target: dsColor("--fn-warn-fill", "#f59e0b", el), rm: dsColor("--mus-accent", "#e5484d", el), grid: dsColor("--line", "", el), tick: dsColor("--mut", "", el) };
}
// Axes : après le rendu, la carte principale a pu devenir foncée → on relit ses couleurs.
function dsCharts() {
  if (!DS.on || typeof Chart === "undefined" || !Chart.instances) return;
  Object.values(Chart.instances).forEach(c => {
    const C = dsChartColors(c.canvas);
    c.options.scales && Object.values(c.options.scales).forEach(s => { s.grid = Object.assign(s.grid || {}, { color: C.grid }); s.ticks = Object.assign(s.ticks || {}, { color: C.tick }); });
    c.data.datasets.forEach(d => { if (d._ds) ["borderColor", "backgroundColor"].forEach(k => { if (d._ds[k]) d[k] = C[d._ds[k]]; }); });
    c.update("none");
  });
}

// ---- Accueil : une tuile par univers, d'après la maquette de Vuthy (validé le 26/11) ----
const DS_ICON = {
  nutrition: '<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 0-3 2.5-3 5.5S15 13 17 13v8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
  cuisine: '<path d="M4 10h16v3a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6zM2 10h20M9 6.5c0-1 .8-2 2-2h2c1.2 0 2 1 2 2V10H9z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/>'
};
function dsHomeHTML() {
  const k = todayKey(); let kc = { left: "—", pct: 0 }, soon = 0, fr = 0, w = null, dw = null, next = "—", nex = 0, pctW = 0, nb = 0;
  try { const t = dayTotals(k), T = tDay(k); kc = { left: Math.round(T.kcal - t.kcal), pct: Math.min(100, Math.round(100 * t.kcal / T.kcal)) }; } catch (e) {}
  try { const it = fridgeItems(); fr = it.length; soon = it.filter(expSoon).length; } catch (e) {}
  try { const ws = weightSeries(30); if (ws.length) { w = ws[ws.length - 1].t; dw = w - ws[0].t; } } catch (e) {}
  try { const lw = liveWorkout(), P = program(); const n = lw ? lw.name : Object.keys(P)[0];
    next = n || "—"; const ex = lw ? lw.ex : (P[n] && P[n].ex) || []; nex = ex.length;
    pctW = lw && nex ? Math.round(100 * ex.filter(e => (e.sets || []).length).length / nex) : 0;
    nb = workouts().filter(x => !x.live && Date.now() - x.start < 7 * 864e5).length; } catch (e) {}
  const f1 = n => (n == null ? "—" : (Math.round(n * 10) / 10).toString().replace(".", ","));
  const tile = (u, title, tab, icon, v, sub, pct) => `<div class="dsh-tile" data-u="${u}"><div class="dsh-t">${title}</div>
    <button class="dsh-deep" data-act="tab" data-v="${tab}"><svg viewBox="0 0 24 24">${icon}</svg><span class="dsh-v">${v}</span><span class="dsh-s">${sub}</span><span class="dsh-bar"><i style="width:${pct}%"></i></span></button>
    <button class="dsh-go" data-act="tab" data-v="${tab}">Consulter</button></div>`;
  const ib = (tab, lab) => `<button class="ghost dsh-ib" data-act="tab" data-v="${tab}" aria-label="${lab}" title="${lab}"><svg viewBox="0 0 24 24">${ICONS[tab]}</svg></button>`;
  return `<div class="row between"><h1>Bonjour</h1><div class="row" style="gap:2px">${DS.ctrl ? '<span class="tag" style="margin-right:6px">Démo</span>' : ""}${ib("coach", "Coach")}${ib("profile", "Profil")}</div></div>
  <div class="dsh-grid">
    ${tile("nutrition", "Nutrition", "today", DS_ICON.nutrition, `${kc.left} kcal`, "Calories restantes", 100 - kc.pct)}
    ${tile("cuisine", "Cuisine", "fridge", DS_ICON.cuisine, `${soon} à finir vite`, `${fr} aliments au frigo`, fr ? Math.round(100 * soon / fr) : 0)}
    ${tile("muscu", "Musculation", "workout", ICONS.workout, esc(next), `${nex} exercices · ${nb} cette sem.`, pctW)}
    ${tile("progression", "Progression", "progress", ICONS.progress, `${f1(w)} kg`, dw == null ? "Poids tendance" : `${dw <= 0 ? "▼" : "▲"} ${f1(Math.abs(dw))} kg en 30 jours`, 60)}
  </div>`;
}

  return ks.slice(0, 3).map(btn).join("") + scan + ks.slice(3).map(btn).join("");
}

// ---- Branchements (seulement en mode aperçu) ----
(function dsInit() {
  const q = new URLSearchParams(location.search);
  DS.ctrl = q.has("ds") && q.get("ds") !== "0"; // page d'aperçu (contrôles, données de démo)
  const _render = render, _nav = navHTML;
  navHTML = function () { return DS.on ? dsNavHTML() : _nav.apply(this, arguments); };
  render = function () {
    if (DS.on && S.tab === "home") { if (isEditing()) return; document.getElementById("app").innerHTML = dsHomeHTML(); document.getElementById("nav").innerHTML = navHTML(); renderSheet(); }
    else _render.apply(this, arguments);
    dsAfter();
  };
  dsSet({ on: q.get("ds") !== "0", muscu: q.get("m") || DS.o.muscu, style: q.get("s") || DS.o.style, commun: q.get("c") || DS.o.commun, mode: q.get("mode") || "" });
  if (DS.on && !q.get("screen")) S.tab = "home"; // l'app s'ouvre sur l'accueil
  if (!q.has("ds")) return;
  window.addEventListener("message", e => {
    if (e.origin !== location.origin || !e.data || !e.data.ds) return;
    const d = e.data.ds; dsSet(d);
    if (d.screen) dsScreen(d.screen); else render();
  });
  if (q.get("screen")) setTimeout(() => dsScreen(q.get("screen")), 0);
})();
function dsScreen(s) {
  S.sheet = null;
  if (s === "live" || s === "rest") {
    S.tab = "workout"; S.wMode = "list";
    if (!liveWorkout()) { const n = Object.keys(program())[0]; if (n && ACT.startW) ACT.startW({ dataset: { v: n } }); }
    render();
    if (s === "rest" && ACT.logSet && !document.getElementById("restBar")) { const b = document.querySelector("button[data-act=logSet]"); if (b) ACT.logSet(b); }
    return;
  }
  if (s === "sheet") { S.tab = "today"; render(); if (ACT.openAdd) ACT.openAdd({ dataset: {} }); dsAfter(); return; }
  S.tab = s; render(); window.scrollTo(0, 0);
}
